<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CNES — TDNGo</title>
<style>
html,body{margin:0;min-height:100%;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#loading{min-height:100vh;display:grid;place-items:center;font-size:14px;padding:20px;text-align:center}
</style>
</head>
<body>
<div id="loading">Carregando CNES...</div>
<script>
(async()=>{
  try{
    const r=await fetch('cnes_importacao_modelo_compativel.html',{cache:'no-store'});
    if(!r.ok) throw new Error('cnes_importacao_modelo_compativel.html HTTP '+r.status);
    const html=await r.text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('loading').textContent='Falha ao carregar CNES: '+e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>
