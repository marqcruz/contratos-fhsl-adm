<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CNES — TDNGo</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1117}
#cnes-frame{display:block;width:100%;height:100vh;border:0;background:#0d1117}
</style>
</head>
<body>
<iframe id="cnes-frame" src="cnes-base-current.html" title="CNES"></iframe>
<script>
(function(){
  const frame=document.getElementById('cnes-frame');
  frame.addEventListener('load',function(){
    try{
      const doc=frame.contentDocument;
      if(!doc || !doc.body) throw new Error('Documento CNES indisponível');

      if(!doc.getElementById('tdngo-cnes-enhancements-v2')){
        const sc=doc.createElement('script');
        sc.id='tdngo-cnes-enhancements-v2';
        sc.src='cnes-enhancements-v2.js?v=20260825-1445';
        sc.async=false;
        doc.body.appendChild(sc);
      }

      if(!doc.getElementById('tdngo-cnes-print-enhancements')){
        const sp=doc.createElement('script');
        sp.id='tdngo-cnes-print-enhancements';
        sp.src='cnes-print-enhancements.js?v=20260825-1711';
        sp.async=false;
        doc.body.appendChild(sp);
      }
    }catch(e){
      console.error('Falha ao aplicar melhorias do CNES',e);
    }
  });
})();
</script>
</body>
</html>
