<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conferência Documental — TDNGo</title>
<style>
html,body{margin:0;min-height:100%;background:#f4f7fa;color:#18222d;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
#loading{min-height:100vh;display:grid;place-items:center;color:#667585}
</style>
</head>
<body>
<div id="loading">Carregando Conferência Documental...</div>
<script>
(async()=>{
  try{
    let sess=null;
    try{sess=JSON.parse(sessionStorage.getItem('fhsl_session')||localStorage.getItem('fhsl_session')||'null')}catch(e){}
    if(!sess||!(sess.tdngoToken||sess.token)){location.replace('index.html');return;}
    const loaderUrl='https://raw.githubusercontent.com/marqcruz/contratos-fhsl-adm/0e6ebb5caf15077fb79db59b708a7f3b26ed6ba9/conferencia.html';
    const r=await fetch(loaderUrl,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const src=await r.text();

    const closeScript='</scr'+'ipt>';
    const openTag='<script>';
    const ini=src.indexOf(openTag);
    const fim=src.lastIndexOf(closeScript);
    if(ini<0||fim<=ini) throw new Error('Loader da Conferência inválido.');

    const code=src.slice(ini+openTag.length,fim);
    const nativeWrite=document.write.bind(document);
    const badClose1='<'+String.fromCharCode(92)+'/script>';
    const badClose2='<'+String.fromCharCode(92,92)+'/script>';

    document.write=function(chunk){
      let html=String(chunk==null?'':chunk);
      html=html.split(badClose2).join(closeScript);
      html=html.split(badClose1).join(closeScript);

      // O HTML final da Conferência ainda trazia uma segunda tela de login.
      // A autenticação é exclusivamente pela sessão central do TDNGo.
      if(html.includes('id="page-lista"')){
        html=html.replace(/<div class="login-screen" id="login-screen">[\\s\\S]*?<div class="app" id="app"/m,'<div class="app" id="app"');
        html=html.replace(/\\/\\* LOGIN \\*\\/[\\s\\S]*?\\/\\* APP \\*\\//m,'/* APP */');
        html=html.replace("document.getElementById('login-screen').style.display='none';",'');
        html=html.replace('<body>','<body data-theme="light">');

        const listaCss='<style id="conf-lista-v2-style">'+
          '.conf-toolbar{display:grid!important;grid-template-columns:minmax(280px,2fr) repeat(4,minmax(150px,1fr));gap:8px!important;align-items:center;margin-bottom:8px!important}'+
          '.conf-toolbar input,.conf-toolbar select{width:100%;min-width:0;height:36px;border-radius:8px}'+
          '.conf-toolbar .btn{height:36px;white-space:nowrap}'+
          '.pdf-retention-tag{display:inline-flex;align-items:center;gap:6px;margin:0 0 10px;padding:6px 10px;border:1px solid #cfe0f2;border-radius:999px;background:#eef6ff;color:#285d8f;font-size:11px;font-weight:700}'+
          '.conf-pager{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 2px 0;color:var(--text2);font-size:12px}'+
          '.pager-actions{display:flex;align-items:center;gap:6px}.pager-actions select{height:30px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text);padding:3px 8px}'+
          '.conf-actions{white-space:nowrap}.pdf-empty{opacity:.45}.danger-soft{background:var(--red-bg);color:var(--red-text);border-color:var(--red-bg)}'+
          '@media(max-width:1250px){.conf-toolbar{grid-template-columns:minmax(240px,2fr) repeat(3,minmax(145px,1fr))}}'+
          '@media(max-width:850px){.conf-toolbar{grid-template-columns:1fr 1fr}.conf-toolbar input{grid-column:1/-1}.conf-pager{align-items:flex-start;flex-direction:column}}'+
          '</style>';
        html=html.replace('</head>',listaCss+'</head>');
      }

      const extras='<script data-tdngo-light src="tdngo-light-theme-v1.js?v=20260918-0010">'+closeScript+
        '<script data-tdngo-central-nav src="tdngo-central-nav.js?v=20260918-0010">'+closeScript+
        '<script src="conferencia-lista-v2.js?v=20260918-0010">'+closeScript;
      if(html.includes('</body>')) html=html.replace('</body>',extras+'</body>');

      nativeWrite(html);
    };

    // Executa o JavaScript do loader diretamente, sem fazer o navegador analisar
    // o HTML intermediário. Assim, strings internas com fechamento de script não
    // podem encerrar a tag atual nem aparecer como texto na página.
    new Function(code)();
  }catch(e){
    const el=document.getElementById('loading');
    if(el) el.textContent='Falha ao carregar Conferência: '+(e&&e.message?e.message:e);
    console.error(e);
  }
})();
</script>
</body>
</html>
