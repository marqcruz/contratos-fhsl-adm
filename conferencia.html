<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conferência Documental — TDNGo</title>
<style>html,body{margin:0;min-height:100%;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}#initial{min-height:100vh;display:grid;place-items:center;color:#9aa7b8;padding:20px;text-align:center}</style>
</head>
<body>
<div id="initial">Carregando Conferência Documental...</div>
<script>
(async()=>{try{
  const src='https://raw.githubusercontent.com/marqcruz/contratos-fhsl-adm/a1335a6875415966e37d251e720c0faf877c3eff/conferencia.html?v=20260831-1200';
  const r=await fetch(src,{cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  let wrapper=await r.text();
  const alvo='document.open();document.write(html);document.close();';
  const patch=`html=html.replace("const s=sessionStorage.getItem('fhsl_session');","const s=sessionStorage.getItem('fhsl_session')||localStorage.getItem('fhsl_session');");
 html=html.replace("if(s){ try{ currentUser=JSON.parse(s); if(currentUser&&currentUser.tdngoToken) startApp(); else currentUser=null; }catch(e){currentUser=null;} }","if(s){ try{ currentUser=JSON.parse(s); if(currentUser&&!currentUser.tdngoToken&&currentUser.token) currentUser.tdngoToken=currentUser.token; if(currentUser&&currentUser.tdngoToken){ try{sessionStorage.setItem('fhsl_session',JSON.stringify(currentUser));}catch(e){} startApp(); } else { window.location.replace('index.html'); } }catch(e){ window.location.replace('index.html'); } } else { window.location.replace('index.html'); }");
 document.open();document.write(html);document.close();`;
  if(!wrapper.includes(alvo)) throw new Error('Inicialização da Conferência não localizada.');
  wrapper=wrapper.replace(alvo,patch);
  document.open();document.write(wrapper);document.close();
}catch(e){
  const el=document.getElementById('initial');
  if(el)el.textContent='Falha ao carregar Conferência: '+(e&&e.message?e.message:String(e));
  console.error(e);
}})();
</script>
</body>
</html>
