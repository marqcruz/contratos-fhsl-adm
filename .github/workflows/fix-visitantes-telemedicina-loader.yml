name: Fix visitantes telemedicina loader
on:
  push:
    branches: [layout_gpt]
    paths:
      - '.github/workflows/fix-visitantes-telemedicina-loader.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: layout_gpt
      - name: Atualizar cache-bust do menu Telemedicina
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('visitantes.html')
          s=p.read_text(encoding='utf-8')
          old='tdngo-central-nav.js?v=20260905-2158'
          new='tdngo-central-nav.js?v=20260915-1128'
          if old not in s:
              raise SystemExit('referencia antiga nao encontrada')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add visitantes.html
          git commit -m 'fix: carregar Telemedicina no modulo Visitantes'
          git push origin HEAD:layout_gpt
