name: Publicar Telemedicina v3
on:
  push:
    branches: [layout_gpt]
    paths:
      - '.github/workflows/patch-telemedicina-v3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: layout_gpt
      - name: Inserir overrides e cache bust
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('visitantes.html')
          s=p.read_text(encoding='utf-8')
          old='<script data-tdngo-telemedicina-direct src="visitantes-telemedicina-v1.js?v=20260915-1235"></script>'
          new='<script data-tdngo-telemedicina-direct src="visitantes-telemedicina-v1.js?v=20260915-1235"></script>\n<script data-tdngo-telemedicina-v3 src="visitantes-telemedicina-v3-overrides.js?v=20260915-1325"></script>'
          if 'visitantes-telemedicina-v3-overrides.js' not in s:
              if old not in s:
                  raise SystemExit('script base da Telemedicina não encontrado')
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          git rm .github/workflows/patch-telemedicina-v3.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add visitantes.html .github/workflows/patch-telemedicina-v3.yml
          git commit -m 'feat: gestão e auditoria telemedicina v3'
          git push origin HEAD:layout_gpt
