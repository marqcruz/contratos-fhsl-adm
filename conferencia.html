<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conferência Documental — TDNGo</title>
<style>html,body{margin:0;min-height:100%;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}#initial{min-height:100vh;display:grid;place-items:center;color:#9aa7b8;padding:20px;text-align:center}</style>
</head>
<body>
<div id="initial">Carregando Conferência Documental...</div>
<script>
(async()=>{try{
  const src='https://raw.githubusercontent.com/marqcruz/contratos-fhsl-adm/a1335a6875415966e37d251e720c0faf877c3eff/conferencia.html?v=20260831-1105';
  const r=await fetch(src,{cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  let wrapper=await r.text();
  const alvo='document.open();document.write(html);document.close();';
  const sessao='html=html.replace(\'</body>\',\'<script>(function(){try{var s=null;try{s=sessionStorage.getItem("fhsl_session")}catch(e){}if(!s&&window.parent&&window.parent!==window){try{s=window.parent.sessionStorage.getItem("fhsl_session")}catch(e){}}if(s){currentUser=JSON.parse(s);if(currentUser&&!currentUser.tdngoToken&&currentUser.token)currentUser.tdngoToken=currentUser.token;if(currentUser&&currentUser.tdngoToken){var ls=document.getElementById("login-screen");if(ls)ls.style.display="none";setTimeout(function(){try{startApp()}catch(e){console.error(e)}},0)}}}catch(e){console.error("Sessao TDNGo",e)}})();<\\/script></body>\');document.open();document.write(html);document.close();';
  if(!wrapper.includes(alvo)) throw new Error('Inicialização da Conferência não localizada.');
  wrapper=wrapper.replace(alvo,sessao);
  document.open();document.write(wrapper);document.close();
}catch(e){
  const el=document.getElementById('initial');
  if(el)el.textContent='Falha ao carregar Conferência: '+(e&&e.message?e.message:String(e));
  console.error(e);
}})();
</script>
</body>
</html>
