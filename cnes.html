<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CNES — TDNGo</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1117}
#cnes-frame{display:block;width:100%;height:100vh;border:0;background:#0d1117}
</style>
</head>
<body>
<iframe id="cnes-frame" src="cnes-base-current.html" title="CNES"></iframe>
<script>
(function(){
  const frame=document.getElementById('cnes-frame');
  frame.addEventListener('load',function(){
    try{
      const doc=frame.contentDocument;
      const sc=doc.createElement('script');
      sc.textContent=`
(function(){
  const FHSL_CNPJ='13.370.183/0001-89';

  function instalarFiltros(){
    const tipo=document.getElementById('filtro-tipo');
    if(!tipo) return;
    if(!document.getElementById('filtro-cbo')){
      const cbo=document.createElement('select');
      cbo.id='filtro-cbo';
      cbo.innerHTML='<option value="">Todos os CBOs</option>';
      cbo.onchange=function(){ pagina=1; renderTabela(); };
      tipo.insertAdjacentElement('afterend',cbo);

      const ord=document.createElement('select');
      ord.id='ordem-cadastro';
      ord.innerHTML='<option value="nome">Ordenar: nome</option><option value="cad_desc">Cadastro: mais recentes</option><option value="cad_asc">Cadastro: mais antigos</option>';
      ord.onchange=function(){ ordenarRapido(this.value); };
      cbo.insertAdjacentElement('afterend',ord);
    }
  }

  function popularFiltroCbo(){
    instalarFiltros();
    const sel=document.getElementById('filtro-cbo');
    if(!sel) return;
    const atual=sel.value;
    const itens=(CBOS||[]).slice().sort(function(a,b){ return String(a[0]).localeCompare(String(b[0])); });
    sel.innerHTML='<option value="">Todos os CBOs</option>'+itens.map(function(c){ return '<option value="'+esc(c[0])+'">'+esc(c[0]+' - '+c[1])+'</option>'; }).join('');
    if(itens.some(function(c){ return String(c[0])===atual; })) sel.value=atual;
  }

  const carregarListasOriginal=carregarListas;
  carregarListas=async function(){
    try{
      const r=await apiFetch('getcneslistas',{_ts:Date.now()});
      if(r && r.ok && r.listas){
        if(Array.isArray(r.listas.cbos) && r.listas.cbos.length) CBOS=r.listas.cbos;
        if(Array.isArray(r.listas.conselhos) && r.listas.conselhos.length) CONSELHOS=r.listas.conselhos;
        if(Array.isArray(r.listas.vinculos) && r.listas.vinculos.length) VINCULOS=r.listas.vinculos;
        preencherCbos(); preencherConselhos(); preencherVinculos(); popularFiltroCbo();
        return;
      }
    }catch(e){ console.warn('CNES: falha ao atualizar listas da Administração',e); }
    await carregarListasOriginal();
    popularFiltroCbo();
  };

  const tipoMudouOriginal=tipoMudou;
  tipoMudou=function(){
    tipoMudouOriginal();
    const t=document.getElementById('cd-tipo')?.value;
    const cnpj=document.getElementById('cd-cnpj');
    if(cnpj && (t==='1'||t==='2') && !String(cnpj.value||'').trim()){
      cnpj.value=FHSL_CNPJ;
      if(typeof validarCnpjVisual==='function') validarCnpjVisual();
    }
  };

  document.addEventListener('input',function(ev){
    if(ev.target && ev.target.id==='cd-nome'){
      const ini=ev.target.selectionStart, fim=ev.target.selectionEnd;
      ev.target.value=String(ev.target.value||'').toLocaleUpperCase('pt-BR');
      try{ ev.target.setSelectionRange(ini,fim); }catch(e){}
    }
  });

  const salvarCadastroOriginal=salvarCadastro;
  salvarCadastro=async function(){
    const nome=document.getElementById('cd-nome');
    if(nome) nome.value=String(nome.value||'').trim().toLocaleUpperCase('pt-BR');
    return salvarCadastroOriginal.apply(this,arguments);
  };

  const abrirCadastroOriginal=abrirCadastro;
  abrirCadastro=function(){
    abrirCadastroOriginal();
    tipoMudou();
    carregarListas();
  };

  const listaFiltradaOriginal=listaFiltrada;
  listaFiltrada=function(){
    let lista=listaFiltradaOriginal();
    const fcbo=document.getElementById('filtro-cbo')?.value||'';
    if(fcbo) lista=lista.filter(function(c){ return String(c.CBO||'')===fcbo; });
    return lista;
  };

  parseData=function(v){
    if(!v) return 0;
    const d=new Date(v);
    if(!isNaN(d.getTime())) return d.getTime();
    const m=String(v).match(/(\\d{2})\\/(\\d{2})\\/(\\d{4})(?:\\s+(\\d{2}):(\\d{2}))?/);
    if(!m) return 0;
    return new Date(m[3],Number(m[2])-1,m[1],m[4]||0,m[5]||0).getTime();
  };

  fmtDataHora=function(v){
    if(!v) return '—';
    const s=String(v);
    if(/^\\d{2}\\/\\d{2}\\/\\d{4}\\s+\\d{2}:\\d{2}/.test(s)) return s;
    const d=new Date(s);
    if(isNaN(d.getTime())) return s;
    return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  };

  ordenarRapido=function(v){
    if(v==='cad_desc'){ ordCampo='CriadoEm'; ordDir=-1; }
    else if(v==='cad_asc'){ ordCampo='CriadoEm'; ordDir=1; }
    else { ordCampo='Nome'; ordDir=1; }
    pagina=1;
    renderTabela();
  };

  const montarFiltroCompOriginal=montarFiltroComp;
  montarFiltroComp=function(){
    montarFiltroCompOriginal();
    popularFiltroCbo();
  };

  instalarFiltros();
  popularFiltroCbo();
  if(currentUser) carregarListas();
  window.addEventListener('focus',function(){ if(currentUser) carregarListas(); });
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'&&currentUser) carregarListas(); });
  setInterval(function(){ if(document.visibilityState==='visible'&&currentUser) carregarListas(); },60000);
})();`;
      doc.body.appendChild(sc);
    }catch(e){
      console.error('Falha ao aplicar melhorias do CNES',e);
    }
  });
})();
</script>
</body>
</html>
