name: Finalizar categorias e collapse
on:
  push:
    branches: [layout_gpt]
    paths: ['.github/workflows/finaliza-categorias-collapse.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: layout_gpt
      - name: Atualizar carregadores
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('contratos.html')
          s=p.read_text(encoding='utf-8')
          import re
          s=re.sub(r"const VERSION='[^']+';", "const VERSION='20260908-1640';", s, count=1)
          s=s.replace('tdngo-central-nav.js?v=20260908-1625','tdngo-central-nav.js?v=20260908-1640')
          p.write_text(s,encoding='utf-8')

          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          old='html=html.replace(\'</body>\',\'<script src="admin-unified-access.js?v=20260901-2335"><\\/script></body>\');'
          new='html=html.replace(\'</body>\',\'<script src="admin-unified-access.js?v=20260908-1640"><\\/script><script src="admin-categorias-objeto.js?v=20260908-1640"><\\/script></body>\');'
          if old in s:
              s=s.replace(old,new,1)
          elif 'admin-categorias-objeto.js' not in s:
              raise SystemExit('Ponto de carga do Admin não localizado')
          s=s.replace('tdngo-central-nav.js?v=20260905-2158','tdngo-central-nav.js?v=20260908-1640')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar
        run: |
          grep -q "contratos-categorias-v10.js?v='+VERSION" contratos.html
          grep -q "VERSION='20260908-1640'" contratos.html
          grep -q 'admin-categorias-objeto.js?v=20260908-1640' admin.html
      - name: Commit
        run: |
          git config user.name "TDNGo Automation"
          git config user.email "actions@users.noreply.github.com"
          git add contratos.html admin.html
          git commit -m "TDNGo: ativa categorias globais e collapse de aditivos"
          git push origin layout_gpt
