<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Segurança Institucional — TDNGo</title>
<style>
html,body{margin:0;min-height:100%;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#loading{min-height:100vh;display:grid;place-items:center;font-size:14px;padding:20px;text-align:center}
</style>
</head>
<body>
<div id="loading">Carregando Segurança Institucional...</div>
<script>
(async()=>{
  try{
    const url='https://raw.githubusercontent.com/marqcruz/contratos-fhsl-adm/layout_gpt/.tdngo/seguranca/payload.txt';
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const b64=(await r.text()).trim();
    const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const ds=new DecompressionStream('gzip');
    const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('loading').textContent='Falha ao carregar Segurança: '+e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>
