name: Aplicar escopo por perfil manutenção
on:
  push:
    branches: [layout_gpt]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: layout_gpt
      - name: Atualizar API de manutenção
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('manutencao-app.js')
          s=p.read_text(encoding='utf-8')
          old='https://nsbhhmrhzkqkaoznaeif.supabase.co/functions/v1/tdngo-manutencao-api'
          new='https://nsbhhmrhzkqkaoznaeif.supabase.co/functions/v1/tdngo-manutencao-scope-api'
          if old not in s:
              raise SystemExit('URL antiga não encontrada em manutencao-app.js')
          p.write_text(s.replace(old,new),encoding='utf-8')
          h=Path('manutencao.html')
          hs=h.read_text(encoding='utf-8')
          hs=hs.replace('manutencao-app.js?v=20260913-1','manutencao-app.js?v=20260915-scope1')
          h.write_text(hs,encoding='utf-8')
          PY
      - name: Remover workflow temporário e publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/manutencao-scope-fix.yml
          git add manutencao-app.js manutencao.html
          git commit -m 'fix: respeitar perfil operacional no módulo manutenção'
          git push origin HEAD:layout_gpt
