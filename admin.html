<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração — TDNGo</title><style>html,body{margin:0;min-height:100%;background:#f4f7fa;color:#18222d;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}#loading{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center;color:#667585}</style></head>
<body><div id="loading">Carregando Administração...</div>
<script>
(async()=>{
  try{
    const r=await fetch('admin-base-current.html?v=20260917-0215',{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    let html=await r.text();

    // A Administração já possui tema próprio. Evita iniciar os observadores globais
    // de tema/robustez durante a reconstrução dinâmica da página no Firefox.
    html=html.replace(/<script[^>]*data-tdngo-light[^>]*><\/script>/gi,'');
    html=html.replace(/<script[^>]*data-tdngo-central-nav[^>]*><\/script>/gi,'');

    html=html.replace('id="tb-users"','id="tb_users"').replace('id="tb-units"','id="tb_units"').replace('id="tb-locals"','id="tb_locals"').replace('id="tb-audit"','id="tb_audit"').replace(/\blogin\(\)/g,'doLogin()');
    html=html.replace("sessionStorage.getItem('fhsl_session')||'null'","sessionStorage.getItem('fhsl_session')||localStorage.getItem('fhsl_session')||'null'");
    html=html.replace("function logout(){sessionStorage.removeItem('fhsl_session');location.reload()}","function logout(){try{sessionStorage.removeItem('fhsl_session');localStorage.removeItem('fhsl_session')}catch(e){}location.replace('index.html?logout=1')}");
    html=html.replace('<button class="btn" onclick="theme()">◐ Tema</button>','');
    html=html.replace("document.body.dataset.theme=localStorage.getItem('tdngo_theme')||'dark'","document.body.dataset.theme='light';localStorage.setItem('tdngo_theme','light')");
    html=html.replace('<button class="active" data-page="usuarios" onclick="show(\'usuarios\',this)">👤 Usuários</button>','<button class="active" data-page="usuarios" onclick="show(\'usuarios\',this)">👤 Usuários e acessos</button><a href="admin-visitantes.html">🪪 Config. Visitantes</a>');
    html=html.replace('<a class="home" href="index.html">⌂ TDNGo</a>','<a class="home" href="index.html">← Voltar ao TDNGo</a>');
    html=html.replace("['conferencia','📑 Conferência'],['admin','⚙️ Administração']","['conferencia','📑 Conferência'],['documentos','📄 Documentos Internos'],['planejamento_compras','📦 Planejamento de Compras'],['patrimonios','🏷️ Patrimônios'],['risco','🏷️ Classificação de Risco'],['manutencao','🛠️ Manutenção'],['admin','⚙️ Administração']");
    html=html.replace(/<div class="full"><label style="text-transform:none"><input id="uaprova"[\s\S]*?<\/label><\/div>/,'');
    html=html.replace(/uaprova\.checked=bool\(u\?\.AprovaConf\);?/g,'');
    html=html.replace(/,AprovaConf:uaprova\.checked/g,'');
    html=html.replace(/,AprovaConf:bool\(u\.AprovaConf\)/g,'');

    html=html.replace('</style>','.storage-card{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:16px;margin-bottom:15px}.storage-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}.storage-title{font-size:14px;font-weight:800}.storage-value{font-size:25px;font-weight:850;margin-top:3px}.storage-meta{font-size:11px;color:var(--muted);margin-top:3px}.storage-progress{height:12px;background:var(--surface2);border:1px solid var(--border);border-radius:999px;overflow:hidden;margin:12px 0 7px}.storage-progress>div{height:100%;width:0;background:var(--accent);border-radius:999px;transition:.25s}.storage-stats{display:grid;grid-template-columns:repeat(3,minmax(110px,1fr));gap:8px;margin-top:11px}.storage-mini{background:var(--surface2);border-radius:8px;padding:9px 11px}.storage-mini b{display:block;font-size:16px}.storage-mini span{font-size:10px;color:var(--muted)}@media(max-width:650px){.storage-stats{grid-template-columns:1fr 1fr}}</style>');
    html=html.replace('<section class="page active" id="p-usuarios"><div class="cards">','<section class="page active" id="p-usuarios"><div class="storage-card" id="storage-card"><div class="storage-head"><div><div class="storage-title">💾 Armazenamento de arquivos</div><div class="storage-value" id="storage-usage">Aguardando...</div><div class="storage-meta" id="storage-meta">A consulta será feita após carregar os cadastros</div></div><button class="btn sm" onclick="loadStorageUsage()">Atualizar</button></div><div class="storage-progress"><div id="storage-bar"></div></div><div class="storage-stats"><div class="storage-mini"><b id="storage-pct">—</b><span>do limite gratuito</span></div><div class="storage-mini"><b id="storage-files">—</b><span>arquivos armazenados</span></div><div class="storage-mini"><b id="storage-pdfs">—</b><span>PDFs armazenados</span></div></div></div><div class="cards">');
    html=html.replace("const AUTH='https://nsbhhmrhzkqkaoznaeif.supabase.co/functions/v1/tdngo-auth-api', ADMIN='https://nsbhhmrhzkqkaoznaeif.supabase.co/functions/v1/tdngo-admin-data-api', AUDIT='https://nsbhhmrhzkqkaoznaeif.supabase.co/functions/v1/tdngo-auditoria-api';","const AUTH='https://nsbhhmrhzkqkaoznaeif.supabase.co/functions/v1/tdngo-auth-api', ADMIN='https://nsbhhmrhzkqkaoznaeif.supabase.co/functions/v1/tdngo-admin-data-api', AUDIT='https://nsbhhmrhzkqkaoznaeif.supabase.co/functions/v1/tdngo-auditoria-api', STORAGE_ADMIN='https://nsbhhmrhzkqkaoznaeif.supabase.co/functions/v1/tdngo-admin-storage-api';");

    // Impede chamadas penduradas indefinidamente e trata sessão expirada de forma explícita.
    const oldPost="async function post(url,body,auth=true){const h={'Content-Type':'application/json'};if(auth)h.Authorization='Bearer '+token;const r=await fetch(url,{method:'POST',headers:h,body:JSON.stringify(body)});const txt=await r.text();let j;try{j=JSON.parse(txt)}catch{j={ok:false,message:txt}};if(!r.ok||!j.ok)throw new Error(j.message||('HTTP '+r.status));return j}";
    const newPost="async function post(url,body,auth=true){const h={'Content-Type':'application/json'};if(auth)h.Authorization='Bearer '+token;const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),15000);let r;try{r=await fetch(url,{method:'POST',headers:h,body:JSON.stringify(body),cache:'no-store',signal:ac.signal})}catch(e){clearTimeout(tm);if(e?.name==='AbortError')throw new Error('A consulta demorou mais de 15 segundos. Tente novamente.');throw e}clearTimeout(tm);const txt=await r.text();let j;try{j=JSON.parse(txt)}catch{j={ok:false,message:txt}};if(r.status===401){try{sessionStorage.removeItem('fhsl_session');localStorage.removeItem('fhsl_session')}catch(e){}location.replace('index.html?session=expired');throw new Error('Sessão expirada.')}if(!r.ok||!j.ok)throw new Error(j.message||('HTTP '+r.status));return j}";
    html=html.replace(oldPost,newPost);

    const oldLoad="async function loadAll(){try{const r=await post(ADMIN,{action:'bootstrapAdmin'});users=r.usuarios||[];units=r.unidades||[];locals=r.locais||[];renderUsers();renderUnits();renderLocals()}catch(e){toast(e.message,'err')}}";
    const newLoad="async function loadStorageUsage(){const el=id=>document.getElementById(id);if(el('storage-usage'))el('storage-usage').textContent='Carregando...';if(el('storage-meta'))el('storage-meta').textContent='Consultando Supabase Storage';try{const r=await post(STORAGE_ADMIN,{action:'usage'}),d=r.data||{},bytes=Number(d.bytes_total||0),quota=Number(r.quota_bytes||1073741824),pct=quota?bytes/quota*100:0;const fmt=b=>b<1048576?(b/1024).toLocaleString('pt-BR',{maximumFractionDigits:1})+' KB':b<1073741824?(b/1048576).toLocaleString('pt-BR',{maximumFractionDigits:1})+' MB':(b/1073741824).toLocaleString('pt-BR',{maximumFractionDigits:2})+' GB';el('storage-usage').textContent=fmt(bytes)+' de '+fmt(quota);el('storage-meta').textContent=(r.plan||'Free')+' · dados reais do Storage';el('storage-pct').textContent=pct.toLocaleString('pt-BR',{maximumFractionDigits:2})+'%';el('storage-files').textContent=Number(d.arquivos_total||0).toLocaleString('pt-BR');el('storage-pdfs').textContent=Number(d.pdfs_total||0).toLocaleString('pt-BR');el('storage-bar').style.width=Math.max(.3,Math.min(100,pct))+'%';el('storage-bar').style.background=pct>=90?'var(--red)':pct>=70?'var(--yellow)':'var(--accent)'}catch(e){if(el('storage-usage'))el('storage-usage').textContent='Não foi possível carregar';if(el('storage-meta'))el('storage-meta').textContent=e.message||'Erro ao consultar armazenamento'}}\nasync function loadAll(){try{const r=await post(ADMIN,{action:'bootstrapAdmin'});users=r.usuarios||[];units=r.unidades||[];locals=r.locais||[];renderUsers();renderUnits();renderLocals();setTimeout(()=>loadStorageUsage(),80)}catch(e){toast(e.message,'err')}}";
    html=html.replace(oldLoad,newLoad);
    html=html.replace("usuarios:['Usuários','Perfis e permissões']","usuarios:['Usuários e acessos','Cadastro, perfil, módulos, unidades e segurança da conta']");
    html=html.replace('<h1 id="title">Usuários</h1><div class="muted" id="sub">Perfis e permissões</div>','<h1 id="title">Usuários e acessos</h1><div class="muted" id="sub">Cadastro, perfil, módulos, unidades e segurança da conta</div>');

    // Complementos carregados apenas depois do núcleo da página, sem tema/robustez global.
    html=html.replace('</body>','<script src="admin-unified-access.js?v=20260917-0215"><\/script><script src="admin-master-v1.js?v=20260917-0215"><\/script><script src="admin-categorias-objeto.js?v=20260908-1640"><\/script><script src="admin-passwords-v1.js?v=20260917-0215"><\/script></body>');

    if(html.includes('href="acessos.html"'))throw new Error('Link redundante de Acessos ainda presente.');
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById('loading').textContent='Falha ao carregar Administração: '+(e&&e.message?e.message:String(e));console.error(e)}
})();
</script>
</body></html>
