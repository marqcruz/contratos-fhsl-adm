<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Segurança Institucional — TDNGo</title><style>html,body{margin:0;min-height:100%;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}#loading{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center}</style></head>
<body><div id="loading">Carregando Segurança...</div><script>
(async()=>{try{
 const base='https://raw.githubusercontent.com/marqcruz/contratos-fhsl-adm/a3a45ed9045cb27c196e05409660ff6fcca326e1/seguranca.html';
 const r=await fetch(base,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let html=await r.text();

 const oldBoot="async function bootstrap(){try{const r=await api('bootstrap');ocorrencias=r.data.ocorrencias||[];unidades=r.data.unidades||[];user=r.data.user||{};$('who').textContent=`${user.nome||''} · ${user.fullAccess?'Visão gerencial completa':user.unidade||'Unidade não vinculada'}`;$('scope-note').textContent=user.fullAccess?'Você possui visão completa de todas as unidades.':'Acesso restrito às ocorrências da sua unidade: '+(user.unidade||'não vinculada');$('tab-gestao').style.display=user.fullAccess?'inline-block':'none';$('f-unidade-wrap').style.display=user.fullAccess?'block':'none';preencheUnidades();renderTabela();renderGestao()}catch(e){toast(e.message);$('scope-note').textContent=e.message}}";
 const newBoot="async function bootstrap(){try{const r=await api('bootstrap');ocorrencias=r.data.ocorrencias||[];unidades=r.data.unidades||[];user=r.data.user||{};const n=unidades.length;$('who').textContent=`${user.nome||''} · ${user.fullAccess?'Visão gerencial completa':n===1?unidades[0].nome:n+' unidades vinculadas'}`;$('scope-note').textContent=user.fullAccess?'Você possui visão completa de todas as unidades.':n?('Acesso restrito às unidades vinculadas: '+unidades.map(x=>x.nome).join(', ')):'Nenhuma unidade vinculada ao módulo Segurança.';$('tab-gestao').style.display=user.fullAccess?'inline-block':'none';$('f-unidade-wrap').style.display=(user.fullAccess||n>1)?'block':'none';preencheUnidades();renderTabela();renderGestao()}catch(e){toast(e.message);$('scope-note').textContent=e.message}}";
 if(html.includes(oldBoot))html=html.replace(oldBoot,newBoot);
 const oldUnits="function preencheUnidades(){const opts=unidades.map(u=>`<option value=\"${u.id}\">${esc(u.nome)}</option>`).join('');$('f-unidade').innerHTML='<option value=\"\">Todas</option>'+opts;$('n-unidade').innerHTML=opts;if(!user.fullAccess&&user.unidadeId){$('n-unidade').value=user.unidadeId;$('n-unidade').disabled=true}else $('n-unidade').disabled=false}";
 const newUnits="function preencheUnidades(){const opts=unidades.map(u=>`<option value=\"${u.id}\">${esc(u.nome)}</option>`).join('');$('f-unidade').innerHTML='<option value=\"\">Todas</option>'+opts;$('n-unidade').innerHTML=opts;if(!user.fullAccess&&unidades.length===1){$('n-unidade').value=unidades[0].id;$('n-unidade').disabled=true}else $('n-unidade').disabled=false}";
 if(html.includes(oldUnits))html=html.replace(oldUnits,newUnits);

 html=html.replace('<div class="section-title">Fotos / evidências</div><div class="photo-input"><input type="file" id="n-fotos" accept="image/jpeg,image/png,image/webp" multiple><div class="sub">Até 6 imagens, máximo de 5 MB cada.</div></div>','<div class="section-title">Fotos / evidências</div><div class="photo-input"><input type="file" id="n-fotos" accept="image/jpeg,image/png,image/webp" multiple><div class="sub">Até 6 imagens, máximo de 5 MB cada.</div></div><div class="section-title">Boletim de Ocorrência</div><div class="photo-input"><input type="file" id="n-bo" accept="application/pdf,.pdf"><div class="sub">Opcional. Anexe o Boletim de Ocorrência em PDF, máximo de 10 MB.</div></div>');
 html=html.replace('<div class="modal" id="modal-form"><div class="box"><div class="box-head"><b>Nova ocorrência</b>','<div class="modal" id="modal-form"><div class="box"><div class="box-head"><b id="form-title">Nova ocorrência</b>');
 html=html.replace('<div class="section-title">Fotos</div><div id="d-gallery" class="gallery"></div>','<div class="section-title">Anexos / evidências</div><div id="d-gallery" class="gallery"></div>');
 html=html.replace('<a class="home" href="index.html">⌂ TDNGo</a>','<a class="home" href="index.html">← Voltar ao TDNGo</a>');

 const extra=`
const BO_API='https://nsbhhmrhzkqkaoznaeif.supabase.co/functions/v1/tdngo-seguranca-bo-api';
let editandoId='';
function perfilGestor(){return ['gestor','admin'].includes(String(user?.role||'').toLowerCase())}
function perfilAdmin(){return String(user?.role||'').toLowerCase()==='admin'}
function corrigirUrlAnexo(u){u=String(u||'');return u.replace('https://nsbhhmrhzkqkaoznaeif.supabase.co/object/sign/','https://nsbhhmrhzkqkaoznaeif.supabase.co/storage/v1/object/sign/')}
async function boApi(body){const r=await fetch(BO_API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(body)});let d={};try{d=await r.json()}catch{}if(!r.ok||!d.ok)throw new Error(d.message||'Falha ao anexar o Boletim de Ocorrência.');return d}
const _novaOcorrencia=novaOcorrencia;
novaOcorrencia=function(){editandoId='';_novaOcorrencia();if($('form-title'))$('form-title').textContent='Nova ocorrência';$('btn-save-new').textContent='Registrar ocorrência';if($('n-bo'))$('n-bo').value=''};
function editarOcorrencia(id){if(!perfilGestor())return;const o=ocorrencias.find(x=>x.ID===id);if(!o)return;editandoId=id;if($('form-title'))$('form-title').textContent='Editar ocorrência · '+o.Numero;$('btn-save-new').textContent='Salvar alterações';const d=new Date(o.Data);$('n-data').value=isNaN(d.getTime())?'':new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);$('n-unidade').value=o.UnidadeId||'';$('n-grav').value=o.Gravidade||'BAIXA';$('n-tipo').value=o.Tipo||'OUTRO';$('n-local').value=o.Local||'';$('n-ext').value=o.Externo||'NÃO';$('n-desc').value=o.Descricao||'';$('n-dano').value=o.Dano||'NÃO';$('n-valor').value=o.Valor||0;$('n-valor-wrap').style.display=o.Dano==='SIM'?'block':'none';$('n-fotos').value='';if($('n-bo'))$('n-bo').value='';$('env-list').innerHTML='';(o.Envolvidos?.length?o.Envolvidos:[{}]).forEach(addEnv);closeModal('modal-detail');$('modal-form').classList.add('open')}
const _salvarNova=salvarNova;
salvarNova=async function(){if(!editandoId){const bo=$('n-bo')?.files?.[0];if(!bo)return _salvarNova();const b=$('btn-save-new');b.disabled=true;try{const payload={Data:$('n-data').value,UnidadeId:$('n-unidade').value,Gravidade:$('n-grav').value,Tipo:$('n-tipo').value,Local:$('n-local').value.trim(),Externo:$('n-ext').value,Descricao:$('n-desc').value.trim(),Dano:$('n-dano').value,Valor:$('n-valor').value,Envolvidos:getEnvs()};const rr=await api('save',{payload});const fs=[...$('n-fotos').files].slice(0,6);for(const f of fs){if(f.size>5*1024*1024)throw new Error(f.name+': máximo de 5 MB.');await api('uploadAttachment',{ocorrenciaId:rr.id,nome:f.name,mimeType:f.type,base64:await file64(f)})}if(bo.size>10*1024*1024)throw new Error('O Boletim de Ocorrência deve ter no máximo 10 MB.');await boApi({action:'uploadBo',ocorrenciaId:rr.id,nome:bo.name,base64:await file64(bo)});closeModal('modal-form');await bootstrap();toast('Ocorrência '+rr.numero+' registrada como ABERTA.')}catch(e){toast(e.message)}finally{b.disabled=false}return}
 const b=$('btn-save-new');b.disabled=true;try{const o=ocorrencias.find(x=>x.ID===editandoId);const payload={ID:editandoId,Data:$('n-data').value,UnidadeId:$('n-unidade').value,Gravidade:$('n-grav').value,Tipo:$('n-tipo').value,Local:$('n-local').value.trim(),Externo:$('n-ext').value,Descricao:$('n-desc').value.trim(),Dano:$('n-dano').value,Valor:$('n-valor').value,Envolvidos:getEnvs(),Status:o?.Status||'ABERTA',Responsavel:o?.Responsavel||'',Prazo:o?.Prazo||'',Providencias:o?.Providencias||'',Conclusao:o?.Conclusao||''};const rr=await api('save',{payload});const fs=[...$('n-fotos').files].slice(0,6);for(const f of fs){if(f.size>5*1024*1024)throw new Error(f.name+': máximo de 5 MB.');await api('uploadAttachment',{ocorrenciaId:rr.id,nome:f.name,mimeType:f.type,base64:await file64(f)})}const bo=$('n-bo')?.files?.[0];if(bo){if(bo.size>10*1024*1024)throw new Error('O Boletim de Ocorrência deve ter no máximo 10 MB.');await boApi({action:'uploadBo',ocorrenciaId:rr.id,nome:bo.name,base64:await file64(bo)})}editandoId='';closeModal('modal-form');await bootstrap();toast('Ocorrência atualizada.')}catch(e){toast(e.message)}finally{b.disabled=false}}
const _renderFotos=renderFotos;
renderFotos=function(arr){arr=(arr||[]).map(a=>({...a,Url:corrigirUrlAnexo(a.Url)}));$('d-gallery').innerHTML=arr.length?arr.map(a=>a.Mime==='application/pdf'?('<div class="photo"><div style="height:120px;display:grid;place-items:center;font-size:38px;background:var(--surface2);cursor:pointer" onclick="window.open(\\''+a.Url+'\\',\\'_blank\\')">📄</div><div class="meta"><b>Boletim de Ocorrência</b><br>'+esc(a.Nome)+'<br><a href="'+a.Url+'" target="_blank" rel="noopener">Abrir PDF</a></div></div>'):('<div class="photo"><img src="'+a.Url+'" alt="Evidência" onclick="window.open(this.src,\\'_blank\\')"><div class="meta">'+esc(a.Nome)+'</div></div>')).join(''):'<div class="sub">Nenhum anexo informado.</div>'}
const _abrirDetalhe=abrirDetalhe;
abrirDetalhe=async function(id){await _abrirDetalhe(id);const foot=$('btn-tratar')?.parentElement;if(!foot)return;let e=$('btn-editar-oc');if(!e){e=document.createElement('button');e.id='btn-editar-oc';e.className='btn';e.textContent='✏ Editar ocorrência';foot.insertBefore(e,$('btn-tratar'))}e.onclick=()=>editarOcorrencia(id);e.style.display=perfilGestor()?'inline-flex':'none';let d=$('btn-excluir-oc');if(!d){d=document.createElement('button');d.id='btn-excluir-oc';d.className='btn danger';d.textContent='🗑 Excluir ocorrência';foot.insertBefore(d,$('btn-tratar'))}d.onclick=()=>excluirOcorrencia(id);d.style.display=perfilAdmin()?'inline-flex':'none'};
async function excluirOcorrencia(id){if(!perfilAdmin())return;const o=ocorrencias.find(x=>x.ID===id);if(!o)return;if(!confirm('Excluir definitivamente a ocorrência '+o.Numero+'?\\n\\nOs anexos vinculados também serão removidos.'))return;try{await api('delete',{id});closeModal('modal-detail');await bootstrap();toast('Ocorrência '+o.Numero+' excluída.')}catch(e){toast(e.message)}}
`;
 const mark='bootstrap();';
 const pos=html.lastIndexOf(mark);if(pos<0)throw new Error('Inicialização da Segurança não localizada.');html=html.slice(0,pos)+extra+'\n'+html.slice(pos);
 document.open();document.write(html);document.close();
}catch(e){document.getElementById('loading').textContent='Falha ao carregar Segurança: '+e.message;console.error(e)}})();
</script></body></html>
