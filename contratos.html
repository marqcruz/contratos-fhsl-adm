<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contratos — TDNGo</title>
<style>
html,body{margin:0;min-height:100%;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#loading{min-height:100vh;display:grid;place-items:center;font-size:14px;padding:20px;text-align:center}
</style>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
</head>
<body>
<div id="loading">Carregando Contratos...</div>
<script>
(async()=>{
  try{
    const base='https://raw.githubusercontent.com/marqcruz/contratos-fhsl-adm/layout_gpt/.tdngo/contratos/';
    const paths=['part1.txt','part2.txt','part3.txt','part4.txt','part5.txt'];
    const chunks=await Promise.all(paths.map(p=>fetch(base+p,{cache:'no-store'}).then(r=>{
      if(!r.ok) throw new Error(p+' HTTP '+r.status);
      return r.text();
    })));
    const b64=chunks.join('').replace(/\s+/g,'');
    const raw=atob(b64);
    const bin=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++) bin[i]=raw.charCodeAt(i);
    if(!window.pako) throw new Error('Biblioteca de descompactação não carregou');
    const html=window.pako.ungzip(bin,{to:'string'});
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('loading').textContent='Falha ao carregar Contratos: '+e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>
