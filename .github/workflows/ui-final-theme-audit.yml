name: Auditoria final de tema
on:
  push:
    branches: [layout_gpt]
    paths:
      - '.github/workflows/ui-final-theme-audit.yml'
permissions:
  contents: write
jobs:
  fix_and_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: layout_gpt
          fetch-depth: 1
      - name: Padronizar carregamento e tema
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json

          VER='20260915-1602'
          # Garante que toda referência HTML ao tema/nav use a revisão atual.
          for p in list(Path('.').glob('*.html')) + list(Path('app-manutencao').glob('*.html')):
              s=p.read_text(encoding='utf-8',errors='ignore')
              s=re.sub(r'tdngo-central-nav\.js\?v=[^"\'<>\s]+',f'tdngo-central-nav.js?v={VER}',s)
              s=re.sub(r'tdngo-light-theme-v1\.js\?v=[^"\'<>\s]+',f'tdngo-light-theme-v1.js?v={VER}',s)
              p.write_text(s,encoding='utf-8')

          def replace(path, old, new, required=False):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old in s: s=s.replace(old,new)
              elif required: raise SystemExit(f'{path}: trecho obrigatório não localizado')
              p.write_text(s,encoding='utf-8')

          # Boot da Central: sem flash escuro e tema aplicado no conteúdo histórico antes do document.write.
          replace('index.html',
            'html,body{margin:0;min-height:100%;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}#initial{min-height:100vh;display:grid;place-items:center;color:#9aa7b8}',
            'html,body{margin:0;min-height:100%;background:#f4f7fa;color:#18222d;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}#initial{min-height:100vh;display:grid;place-items:center;color:#667585}', True)
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace(".tdngo-loading{position:fixed;inset:0;z-index:12000;background:radial-gradient(circle at 30% 20%,#16314f 0%,#0d1117 60%);display:flex;align-items:center;justify-content:center}.tdngo-loading-box{text-align:center;color:#e6edf3}.tdngo-spinner{width:36px;height:36px;margin:0 auto 14px;border:3px solid rgba(255,255,255,.2);border-top-color:#79c0ff;border-radius:50%;animation:loginSpin .75s linear infinite}.tdngo-loading-box b{display:block;font-size:15px}.tdngo-loading-box span{display:block;margin-top:5px;font-size:11px;color:#9aa7b8}",".tdngo-loading{position:fixed;inset:0;z-index:12000;background:radial-gradient(circle at 30% 20%,#eaf3ff 0%,#f4f7fa 65%);display:flex;align-items:center;justify-content:center}.tdngo-loading-box{text-align:center;color:#18222d}.tdngo-spinner{width:36px;height:36px;margin:0 auto 14px;border:3px solid #dce4eb;border-top-color:#1769d2;border-radius:50%;animation:loginSpin .75s linear infinite}.tdngo-loading-box b{display:block;font-size:15px}.tdngo-loading-box span{display:block;margin-top:5px;font-size:11px;color:#667585}")
          old="html=html.replace('</body>','<script src=\"index-layout-v3.js?v=20260909-2310\"><\\/script><script src=\"index-account-v1.js?v=20260914-1430\"><\\/script></body>');"
          new=f"html=html.replace('</body>','<script data-tdngo-light src=\"tdngo-light-theme-v1.js?v={VER}\"><\\/script><script src=\"index-layout-v3.js?v=20260909-2310\"><\\/script><script src=\"index-account-v1.js?v=20260914-1430\"><\\/script></body>');"
          if old in s:s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          # Administração: boot claro e o tema/nav devem sobreviver ao document.write.
          replace('admin.html',
            'html,body{margin:0;min-height:100%;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}#loading{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center}',
            'html,body{margin:0;min-height:100%;background:#f4f7fa;color:#18222d;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}#loading{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center;color:#667585}', True)
          p=Path('admin.html'); s=p.read_text(encoding='utf-8')
          old="html=html.replace('</body>','<script src=\"admin-unified-access.js?v=20260909-2305\"><\\/script><script src=\"admin-categorias-objeto.js?v=20260908-1640\"><\\/script><script src=\"admin-passwords-v1.js?v=20260914-1555\"><\\/script></body>');"
          new=f"html=html.replace('</body>','<script data-tdngo-light src=\"tdngo-light-theme-v1.js?v={VER}\"><\\/script><script src=\"admin-unified-access.js?v=20260909-2305\"><\\/script><script src=\"admin-categorias-objeto.js?v=20260908-1640\"><\\/script><script src=\"admin-passwords-v1.js?v=20260914-1555\"><\\/script><script data-tdngo-central-nav src=\"tdngo-central-nav.js?v={VER}\"><\\/script></body>');"
          if old in s:s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          # Visitantes por unidade: remove flash escuro e injeta tema antes de escrever a página real.
          replace('visitantes-unidades.html',
            'html,body{margin:0;min-height:100%;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}#loading-unit{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center}',
            'html,body{margin:0;min-height:100%;background:#f4f7fa;color:#18222d;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}#loading-unit{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center;color:#667585}', True)
          p=Path('visitantes-unidades.html'); s=p.read_text(encoding='utf-8')
          needle="if(!html.includes('trocarUnidadeVisitantes'))throw new Error('Separação por unidade não aplicada.');\n document.open();document.write(html);document.close();"
          repl=f"if(!html.includes('trocarUnidadeVisitantes'))throw new Error('Separação por unidade não aplicada.');\n html=html.replace('</body>','<script data-tdngo-light src=\"tdngo-light-theme-v1.js?v={VER}\"><\\/script></body>');\n document.open();document.write(html);document.close();"
          if needle in s:s=s.replace(needle,repl)
          p.write_text(s,encoding='utf-8')

          # Versões auxiliares da Conferência também não devem abrir escuras.
          for name in ['conferencia-nova.html','conferencia-teste.html']:
              p=Path(name)
              if not p.exists():continue
              s=p.read_text(encoding='utf-8')
              s=s.replace('html,body{margin:0;min-height:100%;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}', 'html,body{margin:0;min-height:100%;background:#f4f7fa;color:#18222d;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}')
              s=s.replace('#initial{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center;color:#9aa7b8}', '#initial{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center;color:#667585}')
              s=s.replace('.session-box{max-width:520px;background:#161b22;border:1px solid #2a3140;border-radius:14px;padding:28px;color:#e6edf3}', '.session-box{max-width:520px;background:#fff;border:1px solid #dce4eb;border-radius:14px;padding:28px;color:#18222d;box-shadow:0 14px 40px rgba(15,23,42,.10)}')
              s=s.replace('.session-box h2{margin:0 0 10px;font-size:20px}.session-box p{margin:0 0 16px;color:#9aa7b8;', '.session-box h2{margin:0 0 10px;font-size:20px}.session-box p{margin:0 0 16px;color:#667585;')
              # injeta no HTML remoto antes do write, se ainda não houver
              marker='document.open();document.write(html);document.close();'
              if marker in s and 'html=html.replace(\'</body>\',\'<script data-tdngo-light' not in s:
                  s=s.replace(marker, f"html=html.replace('</body>','<script data-tdngo-light src=\"tdngo-light-theme-v1.js?v={VER}\"><\\/script><script data-tdngo-central-nav src=\"tdngo-central-nav.js?v={VER}\"><\\/script></body>');\n  "+marker)
              p.write_text(s,encoding='utf-8')

          # Páginas diretas antigas: carrega o tema no head para evitar flash antes do footer/nav.
          direct=['notas_indicadores.html','indicador_laboratorial.html','planejamento-compras.html','admin-cnes.html','admin-visitantes.html','admin-base-current.html','cnes-base-current.html','contratos-base-current.html']
          for name in direct:
              p=Path(name)
              if not p.exists():continue
              s=p.read_text(encoding='utf-8',errors='ignore')
              if 'tdngo-light-theme-v1.js' not in s:
                  s=s.replace('</head>',f'<script data-tdngo-light src="tdngo-light-theme-v1.js?v={VER}"></script></head>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Auditar todas as telas HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json
          rows=[]
          for p in sorted(list(Path('.').glob('*.html'))+list(Path('app-manutencao').glob('*.html'))):
              s=p.read_text(encoding='utf-8',errors='ignore')
              dark=sorted(set(x.lower() for x in re.findall(r'#[0-9a-fA-F]{6}',s) if x.lower() in {'#0d1117','#161b22','#1c2230','#11161d','#111923','#0d131a'}))
              rows.append({
                'arquivo':str(p),'bytes':p.stat().st_size,
                'dark_tokens':dark,
                'light':('tdngo-light-theme-v1.js' in s or 'color-scheme:light' in s or 'background:#f4f7fa' in s or 'background:#f8fafc' in s),
                'central_nav':'tdngo-central-nav.js' in s,
                'document_write':'document.write' in s
              })
          print('\n=== AUDITORIA DE TELAS ===')
          for x in rows:
              flag='OK' if x['light'] else 'REVISAR'
              print(f"{flag:7} {x['arquivo']:<45} dark={','.join(x['dark_tokens']) or '-'} nav={'sim' if x['central_nav'] else 'não'} write={'sim' if x['document_write'] else 'não'}")
          print('\nTOTAL',len(rows),'REVISAR',sum(not x['light'] for x in rows),'COM_TOKENS_ESCUROS',sum(bool(x['dark_tokens']) for x in rows))
          Path('/tmp/ui-audit.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Commit das correções
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ui-final-theme-audit.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: padronizar tema claro em todas as telas'
          git push origin HEAD:layout_gpt
