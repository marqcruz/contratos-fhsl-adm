name: Corrigir alertas manutenção
on:
  push:
    paths:
      - '.github/workflows/manutencao-notification-guard.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: layout_gpt
      - name: Aplicar hotfix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('manutencao.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="manutencao-app.js?v=20260913-1"></script>'
          new='<script src="manutencao-notification-guard-v26.js?v=20260915-1625"></script>\n<script src="manutencao-app.js?v=20260915-1625"></script>'
          if new not in s:
              if old not in s: raise SystemExit('script manutencao-app.js não localizado')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/manutencao-notification-guard.yml
          git add manutencao.html
          git commit -m 'fix: impedir alertas antigos e duplicados no painel de manutenção'
          git push origin HEAD:layout_gpt