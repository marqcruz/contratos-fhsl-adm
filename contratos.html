<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contratos — TDNGo</title><style>html,body{margin:0;min-height:100%;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}#loading{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center}</style></head>
<body><div id="loading">Carregando Contratos...</div>
<script>
(async()=>{
  try{
    const r=await fetch('contratos-base-current.html',{cache:'no-store'});
    if(!r.ok) throw new Error('contratos-base-current.html HTTP '+r.status);
    let html=await r.text();

    html=html.replace('  <div class="nav-group perm-admin"><div class="nav-label">Controle</div><button class="nav-item" data-page="auditoria" onclick="showPage(\'auditoria\',this)">🛡️ Auditoria</button></div>\n','');
    html=html.replace(/\n  <!-- AUDITORIA -->[\s\S]*?\n  <!-- SETUP -->/,'\n  <!-- SETUP -->');
    html=html.replace("  auditoria:['Auditoria','Registro de todas as ações no sistema'],\n",'');
    html=html.replace("  if (id==='auditoria') loadLog();\n",'');

    html=html.replace("    + '<div class=\"stat-card c-green\"><div class=\"stat-num\">'+(users.filter(function(u){return u.ativo;}).length||1)+'</div><div class=\"stat-label\">Usuários ativos</div></div>';",";");
    html=html.replace('async function loadAll(){ await Promise.all([ loadUnits(), loadContracts(), loadUsers() ]); }','async function loadAll(){ await Promise.all([ loadUnits(), loadContracts() ]); }');

    html=html.replace(
      "const CONTRATOS_API_URL = 'https://nsbhhmrhzkqkaoznaeif.supabase.co/functions/v1/tdngo-contratos-api';",
      "const CONTRATOS_API_URL = 'https://nsbhhmrhzkqkaoznaeif.supabase.co/functions/v1/tdngo-contratos-api';\nconst CONTRATOS_PDF_AI_URL = 'https://nsbhhmrhzkqkaoznaeif.supabase.co/functions/v1/tdngo-contratos-pdf-ai';"
    );

    const pdfApi = `async function contratosPdfAi(payload){
  if(!currentUser || !currentUser.tdngoToken) return {ok:false,message:'Sessão sem token do TDNGo. Entre novamente.'};
  const ctrl=new AbortController();
  const tm=setTimeout(function(){ctrl.abort();},120000);
  try{
    const rr=await fetch(CONTRATOS_PDF_AI_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+currentUser.tdngoToken},
      body:JSON.stringify(Object.assign({action:'extractpdf'},payload||{})),
      signal:ctrl.signal
    });
    const txt=await rr.text();let data;
    try{data=JSON.parse(txt)}catch(e){data={ok:false,message:txt||('Erro HTTP '+rr.status)}}
    if(!rr.ok && !data.message)data.message='Erro HTTP '+rr.status;
    return data;
  }catch(e){
    if(e && e.name==='AbortError') return {ok:false,message:'A leitura do PDF excedeu 2 minutos. Tente novamente ou use um PDF menor.'};
    return {ok:false,message:'Falha ao conectar ao serviço de leitura por IA.'};
  }finally{clearTimeout(tm)}
}`;
    html=html.replace('async function contratosApi(action, payload, autenticado){',pdfApi+'\n\nasync function contratosApi(action, payload, autenticado){');

    html=html.replace("apiFetch('extractpdf', { pdfBase64: pendingPdfB64 })","contratosPdfAi({ pdfBase64: pendingPdfB64, fileName: pendingPdfName })");
    html=html.replace("apiFetch('extractpdf', { pdfBase64: f.b64 })","contratosPdfAi({ pdfBase64: f.b64, fileName: f.name })");

    html=html.replace("document.getElementById('dialog-pdf').classList.add('open');","await pdfUseAI();");
    html=html.replace("<p>O que deseja fazer com <strong id=\"dialog-pdf-name\"></strong>?</p>","<p>O PDF <strong id=\"dialog-pdf-name\"></strong> será lido automaticamente pela IA.</p>");

    html=html.replace("window.addEventListener('DOMContentLoaded', function(){","setTimeout(function(){");
    html=html.replace("const sess = sessionStorage.getItem('fhsl_session');","const sess = sessionStorage.getItem('fhsl_session') || localStorage.getItem('fhsl_session'); if(sess&&!sessionStorage.getItem('fhsl_session')) sessionStorage.setItem('fhsl_session',sess);");
    html=html.replace(/sessionStorage\.removeItem\('fhsl_session'\);/g,"sessionStorage.removeItem('fhsl_session');localStorage.removeItem('fhsl_session');");

    // Etiquetas gerenciais do módulo Contratos.
    // Mantém os códigos de classe existentes para não quebrar dashboard/alertas,
    // mas recalcula qual aditivo é o atual e qual foi substituído.
    html=html.replace('>Vigente c/ aditivo</option>','>Vigente com aditivo</option>');
    html=html.replace(/>Substituído<\/option>/g,'>Aditivo substituído</option>');
    html=html.replace(/🔑 vigente/g,'🔑 atual');

    const statusPatch = `<script>
(function(){
  function tdngoDataAditivo(a){
    if(!a) return null;
    var d = parseBR(a.vigenciaInicio);
    if(d) return d;
    d = parseBR(a.dataAssinatura);
    if(d) return d;
    if(a.criadoEm){
      var c = new Date(a.criadoEm);
      if(!isNaN(c)) return c;
    }
    return null;
  }

  window.cmpAditivos = function(a,b){
    var da=tdngoDataAditivo(a), db=tdngoDataAditivo(b);
    if(da && db && da.getTime()!==db.getTime()) return da.getTime()-db.getTime();
    if(da && !db) return 1;
    if(!da && db) return -1;
    var n=cmpNum(a&&a.numero,b&&b.numero);
    if(n!==0) return n;
    return String((a&&a.id)||'').localeCompare(String((b&&b.id)||''));
  };

  window.aditivoMaisRecente = function(pai){
    var lista = contracts.filter(function(a){
      return a.contratoPai===pai.id && a.tipo==='Termo Aditivo' && ['Encerrado','Suspenso'].indexOf(a.statusContrato)<0;
    });
    if(!lista.length) return null;
    lista.sort(cmpAditivos);
    return lista[lista.length-1];
  };

  window.aditivosOrdenados = function(pai){
    return contracts.filter(function(a){
      return a.contratoPai===pai.id && a.tipo==='Termo Aditivo' && ['Encerrado','Suspenso'].indexOf(a.statusContrato)<0;
    }).sort(cmpAditivos);
  };

  function aditivoMaisRecenteHistorico(pai){
    var lista = contracts.filter(function(a){
      return a.contratoPai===pai.id && a.tipo==='Termo Aditivo';
    });
    if(!lista.length) return null;
    lista.sort(cmpAditivos);
    return lista[lista.length-1];
  }

  window.isAditivoVigente = function(a){
    if(a.tipo!=='Termo Aditivo' || !a.contratoPai) return false;
    if(['Encerrado','Suspenso'].indexOf(a.statusContrato)>=0) return false;
    var pai=contracts.find(function(x){return x.id===a.contratoPai;});
    if(!pai) return false;
    var atual=aditivoMaisRecenteHistorico(pai);
    return !!(atual && atual.id===a.id && getVigStatus(a)!=='vencido');
  };

  window.isAditivoSubstituido = function(a){
    if(a.tipo!=='Termo Aditivo' || !a.contratoPai) return false;
    var pai=contracts.find(function(x){return x.id===a.contratoPai;});
    if(!pai) return false;
    var atual=aditivoMaisRecenteHistorico(pai);
    return !!(atual && atual.id!==a.id && cmpAditivos(a,atual)<0);
  };

  window.getStatusLabel = function(c){
    var s=(c.statusContrato||'').toLowerCase();

    // Histórico de aditivos prevalece na etiqueta: todo aditivo anterior ao atual é substituído.
    if(isAditivoSubstituido(c)) return {cls:'substituido',txt:'Aditivo substituído'};

    if(s.indexOf('negoci')>=0) return {cls:'negociacao',txt:'Em negociação'};
    if(s.indexOf('encerr')>=0) return {cls:'encerrado',txt:'Encerrado'};
    if(s.indexOf('suspen')>=0) return {cls:'suspenso',txt:'Suspenso'};

    var v=getVigStatus(c);

    if(c.tipo==='Contrato'){
      var ve=vigenciaEfetiva(c);
      if(ve.fonte && ve.fonte.id!==c.id && (v==='ativo' || v==='vencendo')){
        return {cls:'aditivo-vig',txt:'Vigente com aditivo'};
      }
      if(v==='vencido') return {cls:'vencido',txt:'Contrato vencido'};
      return {cls:(v==='vencendo'?'vencendo':'vigente'),txt:'Contrato vigente'};
    }

    if(v==='vencido') return {cls:'vencido',txt:'Aditivo vencido'};
    return {cls:(v==='vencendo'?'vencendo':'vigente'),txt:'Aditivo vigente'};
  };
})();
<\/script>`;
    html=html.replace('</body>',statusPatch+'\n</body>');

    if(html.includes("apiFetch('extractpdf'")) throw new Error('Ainda existe chamada legada extractpdf no módulo Contratos.');

    document.open(); document.write(html); document.close();
  }catch(e){document.getElementById('loading').textContent='Falha ao carregar Contratos: '+(e&&e.message?e.message:String(e));console.error(e)}
})();
</script></body></html>
