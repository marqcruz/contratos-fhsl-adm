<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contratos de Gestão — TDNGo</title><style>html,body{margin:0;min-height:100%;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}#loading{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center}</style></head>
<body><div id="loading">Carregando Contratos de Gestão...</div>
<script>
(async()=>{
 try{
  const base='https://raw.githubusercontent.com/marqcruz/contratos-fhsl-adm/4a6f1f45767a06a6dd14ba9d9ea04472b609ab9c/contratos-gestao.html';
  const r=await fetch(base,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
  let html=await r.text();
  html=html.replace(/const\s+SCRIPT_URL\s*=\s*'[^']+';/,"const CG_API_URL='https://nsbhhmrhzkqkaoznaeif.supabase.co/functions/v1/tdngo-cg-api';");
  html=html.replace(/\bSCRIPT_URL\b/g,'CG_API_URL');
  html=html.replace(/\bapiFetch\b/g,'cgApi');
  html=html.replace("function isAdmin(){return !!(currentUser&&currentUser.role==='admin');}","function isAdmin(){return !!(currentUser&&['admin','gestor'].includes(String(currentUser.role||'').toLowerCase()));}");
  const oldFn=`async function cgApi(action, payload){
  const r = await fetch(CG_API_URL+'?action='+action, { method:'POST', body: JSON.stringify(payload||{}) });
  const t = await r.text();
  try { return JSON.parse(t); } catch(e){ return { ok:false, message:t }; }
}`;
  const newFn=`async function cgApi(action,payload){
  const tk=(currentUser&&currentUser.tdngoToken)||(()=>{try{return JSON.parse(sessionStorage.getItem('fhsl_session')||'null')?.tdngoToken||''}catch(e){return''}})();
  const headers={'Content-Type':'application/json'};if(tk)headers.Authorization='Bearer '+tk;
  const body=Object.assign({action:action},payload||{});
  const r=await fetch(CG_API_URL,{method:'POST',headers:headers,body:JSON.stringify(body)});
  const t=await r.text();let d;try{d=JSON.parse(t)}catch(e){d={ok:false,message:t||'Resposta inválida'}}
  if(r.status===401&&action!=='authuser'){sessionStorage.removeItem('fhsl_session');}
  return d;
}`;
  if(!html.includes(oldFn))throw new Error('Função de API antiga não localizada para conversão.');
  html=html.replace(oldFn,newFn);
  html=html.replace(/Apps Script v9/g,'API Supabase');
  html=html.replace(/Apps Script/g,'API Supabase');
  if(html.includes('google.com/macros')||html.includes('SCRIPT'+'_URL')||html.includes('api'+'Fetch('))throw new Error('Referência legada permaneceu no Contratos de Gestão.');
  document.open();document.write(html);document.close();
 }catch(e){document.getElementById('loading').textContent='Falha ao carregar Contratos de Gestão: '+e.message;console.error(e)}
})();
</script></body></html>
