<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conferência Documental — TDNGo</title>
<style>html,body{margin:0;min-height:100%;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}#initial{min-height:100vh;display:grid;place-items:center;color:#9aa7b8;padding:20px;text-align:center}</style>
</head>
<body>
<div id="initial">Carregando Conferência Documental...</div>
<script>
(async()=>{try{
  const src='https://raw.githubusercontent.com/marqcruz/contratos-fhsl-adm/a1335a6875415966e37d251e720c0faf877c3eff/conferencia.html?v=20260831-1155';
  const r=await fetch(src,{cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  let wrapper=await r.text();
  const alvo='document.open();document.write(html);document.close();';
  const init=`const sessaoAntiga=\`window.addEventListener('DOMContentLoaded', function(){\n  const s=sessionStorage.getItem('fhsl_session');\n  if(s){ try{ currentUser=JSON.parse(s); if(currentUser&&currentUser.tdngoToken) startApp(); else currentUser=null; }catch(e){currentUser=null;} }\n});\`;\n const sessaoNova=\`setTimeout(function(){\n  let s=null;\n  try{s=sessionStorage.getItem('fhsl_session')||localStorage.getItem('fhsl_session');}catch(e){}\n  if(s){\n    try{\n      currentUser=JSON.parse(s);\n      if(currentUser&&!currentUser.tdngoToken&&currentUser.token) currentUser.tdngoToken=currentUser.token;\n      if(currentUser&&currentUser.tdngoToken){\n        try{sessionStorage.setItem('fhsl_session',JSON.stringify(currentUser));}catch(e){}\n        startApp();\n        return;\n      }\n    }catch(e){currentUser=null;}\n  }\n  currentUser=null;\n},0);\`;\n if(html.includes(sessaoAntiga)) html=html.replace(sessaoAntiga,sessaoNova);\n else html=html.replace(/window\\.addEventListener\\('DOMContentLoaded',[\\s\\S]*?\\n\\}\\);/,sessaoNova);\n document.open();document.write(html);document.close();`;
  if(!wrapper.includes(alvo)) throw new Error('Inicialização da Conferência não localizada.');
  wrapper=wrapper.replace(alvo,init);
  document.open();document.write(wrapper);document.close();
}catch(e){
  const el=document.getElementById('initial');
  if(el)el.textContent='Falha ao carregar Conferência: '+(e&&e.message?e.message:String(e));
  console.error(e);
}})();
</script>
</body>
</html>
