<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Documentos Internos — TDNGo</title>
<style>
:root{color-scheme:light;--azul:#1769d2;--bg:#f4f7fa;--surface:#fff;--surface2:#f7f9fb;--border:#dce4eb;--text:#18222d;--muted:#667585}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);overflow:hidden}.topbar{height:72px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:18px;padding:10px 18px;position:relative;z-index:10}.brand{min-width:240px}.brand h1{font-size:16px;margin:0 0 2px}.brand p{font-size:10px;margin:0;color:var(--muted)}.tabs{display:flex;gap:8px;flex:1;justify-content:center}.tab{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:9px;padding:9px 13px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}.tab:hover{background:#eef4fa}.tab.active{background:var(--azul);border-color:var(--azul);color:#fff}.right{min-width:240px;display:flex;justify-content:flex-end;align-items:center;gap:8px}.back{border:1px solid var(--border);background:var(--surface2);color:var(--text);text-decoration:none;border-radius:9px;padding:8px 11px;font-size:11px;font-weight:700}.frame-wrap{height:calc(100vh - 72px);position:relative}.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);color:var(--muted);z-index:2}iframe{display:block;width:100%;height:100%;border:0;background:#fff}@media(max-width:760px){.topbar{height:auto;min-height:72px;flex-wrap:wrap}.brand{min-width:0;flex:1}.right{min-width:0}.tabs{order:3;width:100%}.tab{flex:1}.frame-wrap{height:calc(100vh - 120px)}}@media print{.topbar{display:none!important}.frame-wrap{height:100vh}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><h1>Documentos Internos</h1><p>Fundação Hospital Santa Lydia</p></div><nav class="tabs"><button class="tab active" data-src="solicitacao_interna_formulario.html" data-title="Solicitação Interna">Solicitação Interna</button><button class="tab" data-src="termo_orientacao_ponto.html" data-title="Termo de Orientação — Ponto">Termo de Orientação — Ponto</button></nav><div class="right"><a class="back" href="index.html" target="_top">← TDNGo</a></div></header>
<main class="frame-wrap"><div class="loading" id="loading">Carregando documento…</div><iframe id="frame" title="Editor de documento"></iframe></main>
<script>
(function(){
 let sess=null;try{sess=JSON.parse(sessionStorage.getItem('fhsl_session')||localStorage.getItem('fhsl_session')||'null')}catch(e){}
 if(!sess){location.replace('index.html');return}
 const frame=document.getElementById('frame'),loading=document.getElementById('loading');
 const docsPermitidos=new Set(['/contratos-fhsl-adm/solicitacao_interna_formulario.html','/contratos-fhsl-adm/termo_orientacao_ponto.html']);
 function openDoc(btn){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');loading.style.display='grid';frame.src=btn.dataset.src+'?v=20260902-1215';frame.title=btn.dataset.title;}
 document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>openDoc(btn)));
 frame.addEventListener('load',()=>{
   try{
     const loc=frame.contentWindow.location;
     const path=loc.pathname;
     const nome=path.split('/').pop();
     if(nome && !['solicitacao_interna_formulario.html','termo_orientacao_ponto.html'].includes(nome)){
       window.top.location.href=loc.href;return;
     }
     const d=frame.contentDocument;
     if(d){
       d.querySelectorAll('a[href]').forEach(a=>{
         const href=a.getAttribute('href')||'';
         if(!href||href.startsWith('#')||href.startsWith('javascript:'))return;
         try{
           const u=new URL(href,loc.href),n=u.pathname.split('/').pop();
           if(n && !['solicitacao_interna_formulario.html','termo_orientacao_ponto.html'].includes(n))a.target='_top';
         }catch(e){}
       });
     }
   }catch(e){}
   loading.style.display='none';
 });
 openDoc(document.querySelector('.tab.active'));
})();
</script>
<script data-tdngo-central-nav src="tdngo-central-nav.js?v=20260915-1552"></script>
</body>
</html>
