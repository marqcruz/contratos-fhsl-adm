<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CNES — TDNGo</title><style>html,body{margin:0;min-height:100%;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}#loading{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center}</style></head>
<body><div id="loading">Carregando CNES...</div>
<script>
(async()=>{
  try{
    const base='https://raw.githubusercontent.com/marqcruz/contratos-fhsl-adm/c26253a7967b886b2547a030f8f3cc7ac201063f/cnes-base-current.html';
    const r=await fetch(base,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    let html=await r.text();
    html=html.replace(/<script src="tdngo-nav\.js"><\/script>/g,'');
    html=html.replace('</body>','<script src="tdngo-nav.js"></script></body>');
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById('loading').textContent='Falha ao carregar CNES: '+(e&&e.message?e.message:String(e));console.error(e)}
})();
</script>
</body></html>
