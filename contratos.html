<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contratos — TDNGo</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#tdngo-loading{position:fixed;inset:0;display:grid;place-items:center;background:#0d1117;z-index:10;color:#9aa7b8;font-size:14px}
#tdngo-loading .box{text-align:center}
#tdngo-loading .spin{width:30px;height:30px;margin:0 auto 12px;border:3px solid #263241;border-top-color:#58a6ff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#contratos-frame{width:100%;height:100%;border:0;display:block;opacity:0;background:#0d1117}
</style>
</head>
<body>
<div id="tdngo-loading"><div class="box"><div class="spin"></div>Carregando Contratos...</div></div>
<iframe id="contratos-frame" title="Módulo Contratos"></iframe>
<script>
(function(){
  const SESSION_KEY='fhsl_session';
  const BASE_URL='contratos-base-current.html?v=20260903-1625';
  const PDF_AI_URL='https://nsbhhmrhzkqkaoznaeif.supabase.co/functions/v1/tdngo-contratos-pdf-ai';

  function getSession(){
    return sessionStorage.getItem(SESSION_KEY)||localStorage.getItem(SESSION_KEY)||'';
  }
  function goHome(){
    window.location.replace('index.html');
  }

  const raw=getSession();
  let user=null;
  try{user=raw?JSON.parse(raw):null;}catch(e){}
  if(!user||!user.tdngoToken){
    sessionStorage.removeItem(SESSION_KEY);
    localStorage.removeItem(SESSION_KEY);
    goHome();
    return;
  }
  const normalized=JSON.stringify(user);
  sessionStorage.setItem(SESSION_KEY,normalized);
  localStorage.setItem(SESSION_KEY,normalized);

  const frame=document.getElementById('contratos-frame');
  const loading=document.getElementById('tdngo-loading');

  frame.addEventListener('load',function(){
    try{
      const w=frame.contentWindow;
      const d=frame.contentDocument;
      if(!w||!d)throw new Error('Não foi possível acessar o módulo carregado.');

      w.sessionStorage.setItem(SESSION_KEY,normalized);
      w.localStorage.setItem(SESSION_KEY,normalized);

      const css=d.createElement('style');
      css.id='tdngo-sso-style';
      css.textContent='#login-screen{display:none!important}';
      (d.head||d.documentElement).appendChild(css);

      const patch = `
(function(){
  var SESSION_KEY='fhsl_session';
  var PDF_AI_URL=${JSON.stringify(PDF_AI_URL)};

  function dataAditivo(a){
    if(!a)return null;
    var d=parseBR(a.vigenciaInicio); if(d)return d;
    d=parseBR(a.dataAssinatura); if(d)return d;
    if(a.criadoEm){var c=new Date(a.criadoEm);if(!isNaN(c))return c;}
    return null;
  }

  cmpAditivos=function(a,b){
    var da=dataAditivo(a),db=dataAditivo(b);
    if(da&&db&&da.getTime()!==db.getTime())return da.getTime()-db.getTime();
    if(da&&!db)return 1;
    if(!da&&db)return -1;
    var n=cmpNum(a&&a.numero,b&&b.numero);
    if(n!==0)return n;
    return String((a&&a.id)||'').localeCompare(String((b&&b.id)||''));
  };

  aditivoMaisRecente=function(pai){
    var lista=contracts.filter(function(a){
      return a.contratoPai===pai.id&&a.tipo==='Termo Aditivo'&&['Encerrado','Suspenso'].indexOf(a.statusContrato)<0;
    });
    if(!lista.length)return null;
    lista.sort(cmpAditivos);
    return lista[lista.length-1];
  };

  aditivosOrdenados=function(pai){
    return contracts.filter(function(a){
      return a.contratoPai===pai.id&&a.tipo==='Termo Aditivo'&&['Encerrado','Suspenso'].indexOf(a.statusContrato)<0;
    }).sort(cmpAditivos);
  };

  function ultimoAditivoHistorico(pai){
    var lista=contracts.filter(function(a){
      return a.contratoPai===pai.id&&a.tipo==='Termo Aditivo';
    });
    if(!lista.length)return null;
    lista.sort(cmpAditivos);
    return lista[lista.length-1];
  }

  isAditivoVigente=function(a){
    if(a.tipo!=='Termo Aditivo'||!a.contratoPai)return false;
    if(['Encerrado','Suspenso'].indexOf(a.statusContrato)>=0)return false;
    var pai=contracts.find(function(x){return x.id===a.contratoPai;});
    if(!pai)return false;
    var atual=ultimoAditivoHistorico(pai);
    return !!(atual&&atual.id===a.id&&getVigStatus(a)!=='vencido');
  };

  isAditivoSubstituido=function(a){
    if(a.tipo!=='Termo Aditivo'||!a.contratoPai)return false;
    var pai=contracts.find(function(x){return x.id===a.contratoPai;});
    if(!pai)return false;
    var atual=ultimoAditivoHistorico(pai);
    return !!(atual&&atual.id!==a.id&&cmpAditivos(a,atual)<0);
  };

  getStatusLabel=function(c){
    var s=(c.statusContrato||'').toLowerCase();
    if(isAditivoSubstituido(c))return{cls:'substituido',txt:'Aditivo substituído'};
    if(s.indexOf('negoci')>=0)return{cls:'negociacao',txt:'Em negociação'};
    if(s.indexOf('encerr')>=0)return{cls:'encerrado',txt:'Encerrado'};
    if(s.indexOf('suspen')>=0)return{cls:'suspenso',txt:'Suspenso'};

    var v=getVigStatus(c);
    if(c.tipo==='Contrato'){
      var ve=vigenciaEfetiva(c);
      if(ve.fonte&&ve.fonte.id!==c.id&&(v==='ativo'||v==='vencendo')){
        return{cls:'aditivo-vig',txt:'Vigente com aditivo'};
      }
      if(v==='vencido')return{cls:'vencido',txt:'Contrato vencido'};
      return{cls:(v==='vencendo'?'vencendo':'vigente'),txt:'Contrato vigente'};
    }
    if(v==='vencido')return{cls:'vencido',txt:'Aditivo vencido'};
    return{cls:(v==='vencendo'?'vencendo':'vigente'),txt:'Aditivo vigente'};
  };

  if(typeof apiFetch==='function'&&!window.__tdngoApiFetchOriginal){
    window.__tdngoApiFetchOriginal=apiFetch;
    apiFetch=async function(action,payload){
      if(action==='extractpdf'){
        if(!currentUser||!currentUser.tdngoToken)return{ok:false,message:'Sessão sem token do TDNGo.'};
        var ctrl=new AbortController();
        var tm=setTimeout(function(){ctrl.abort();},120000);
        try{
          var rr=await fetch(PDF_AI_URL,{
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':'Bearer '+currentUser.tdngoToken},
            body:JSON.stringify(Object.assign({action:'extractpdf'},payload||{})),
            signal:ctrl.signal
          });
          var txt=await rr.text(),data;
          try{data=JSON.parse(txt);}catch(e){data={ok:false,message:txt||('Erro HTTP '+rr.status)};}
          if(!rr.ok&&!data.message)data.message='Erro HTTP '+rr.status;
          return data;
        }catch(e){
          if(e&&e.name==='AbortError')return{ok:false,message:'A leitura do PDF excedeu 2 minutos.'};
          return{ok:false,message:'Falha ao conectar ao serviço de leitura por IA.'};
        }finally{clearTimeout(tm);}
      }
      return window.__tdngoApiFetchOriginal(action,payload);
    };
  }

  doLogout=function(){
    try{sessionStorage.removeItem(SESSION_KEY);localStorage.removeItem(SESSION_KEY);}catch(e){}
    window.top.location.replace('index.html');
  };

  try{
    document.querySelectorAll('option').forEach(function(o){
      if(o.textContent==='Vigente c/ aditivo')o.textContent='Vigente com aditivo';
      if(o.textContent==='Substituído')o.textContent='Aditivo substituído';
    });
    if(typeof refreshAll==='function')refreshAll();
  }catch(e){console.warn('Atualização visual Contratos:',e);}
})();`;

      const patchScript=d.createElement('script');
      patchScript.id='tdngo-contratos-patch';
      patchScript.textContent=patch+`
try{
  var app=document.getElementById('app');
  if(app&&getComputedStyle(app).display==='none'){
    var s=sessionStorage.getItem('fhsl_session')||localStorage.getItem('fhsl_session');
    if(s){
      currentUser=JSON.parse(s);
      if(currentUser&&currentUser.tdngoToken)startApp();
    }
  }
}catch(e){console.warn('Inicialização central Contratos:',e);}`;
      (d.body||d.documentElement).appendChild(patchScript);

      frame.style.opacity='1';
      loading.style.display='none';
    }catch(e){
      console.error('Falha ao integrar Contratos ao TDNGo:',e);
      loading.innerHTML='<div class="box">Falha ao carregar o módulo Contratos.<br><small>Retorne ao TDNGo e tente novamente.</small></div>';
    }
  });

  frame.src=BASE_URL;
})();
</script>
</body>
</html>
