<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Classificação de Risco — TDNGo</title><style>html,body{margin:0;min-height:100%;background:#f4f7fa;color:#18222d;font-family:system-ui,sans-serif;color-scheme:light}#loading{min-height:100vh;display:grid;place-items:center;color:#667585;padding:24px;text-align:center}.deny{max-width:520px;background:#fff;border:1px solid #d9e2ea;border-radius:14px;padding:24px;box-shadow:0 10px 28px rgba(15,23,42,.08)}.deny b{display:block;color:#18222d;font-size:17px;margin-bottom:7px}.deny a{display:inline-block;margin-top:14px;padding:9px 13px;border-radius:9px;background:#1769d2;color:#fff;text-decoration:none;font-weight:700}</style></head>
<body><div id="loading">Carregando Classificação de Risco...</div>
<script>
(async()=>{
  try{
    let sess=null;try{sess=JSON.parse(sessionStorage.getItem('fhsl_session')||localStorage.getItem('fhsl_session')||'null')}catch(e){}
    const token=sess&&(sess.tdngoToken||sess.token);
    if(!sess||!token){location.replace('index.html');return}
    const raw=sess.modulos??sess.Modulos??sess.modules??[];
    const mods=(Array.isArray(raw)?raw:String(raw||'').split(',')).map(x=>String(x).trim().toLowerCase()).filter(Boolean);
    const role=String(sess.role||sess.Role||'').trim().toLowerCase();
    const permitido=['admin','desenvolvedor','developer','master'].includes(role)||mods.includes('risco');
    if(!permitido){document.getElementById('loading').innerHTML='<div class="deny"><b>Acesso não autorizado</b><span>Seu usuário não possui acesso ao módulo Classificação de Risco.</span><br><a href="index.html">Voltar ao TDNGo</a></div>';return}
    const base='https://raw.githubusercontent.com/marqcruz/contratos-fhsl-adm/525fa254ffa22b62110fe84ceb64c3ac313a5d03/risco.html';
    const r=await fetch(base,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
    let html=await r.text();
    html=html.replace('.prio .fill{height:100%;border-radius:6px;width:0;', '.prio .fill{display:block;height:100%;border-radius:6px;width:0;');
    html=html.replace("const cls=r.ind===hlKey?' class=\"hl-'+hlKey+'\"':'';", "const cls='';");
    html=html.replace('<th>LIMITE (MIN)</th><th>ATINGE</th><th>% INDICADOR</th><th>META</th>', '<th>LIMITE (MIN)</th><th>ATINGE</th><th>% DESEMPENHO</th><th>META</th>');
    html=html.replace('<div class="pdf-block"><div class="pdf-h2">Indicador de desempenho '+"'+num+'"+'</div>'+"'+pdfIndicadorTabela()+'"+'</div>', '<div class="pdf-block"><div class="pdf-h2">Desempenho por prioridade</div>'+"'+pdfIndicadorTabela()+'"+'</div>');
    html=html.replace('table.pdf-t tr.hl-1 td{ background:#2f6fb0; color:#fff; }', 'table.pdf-t tr.hl-1 td{ background:#fff; color:#222; }');
    html=html.replace('table.pdf-t tr.hl-2 td{ background:#3f9d6a; color:#fff; }', 'table.pdf-t tr.hl-2 td{ background:#fff; color:#222; }');
    html=html.replace('table.pdf-t tr.hl-3 td{ background:#e0a021; color:#000; }', 'table.pdf-t tr.hl-3 td{ background:#fff; color:#222; }');
    const gate=/<script>\s*\(function\(\)\{\s*var SCRIPT_URL='https:\/\/script\.google\.com[\s\S]*?<\/script>/;
    const replacement=`<script>(function(){function libera(){var g=document.getElementById('fhsl-gate');if(g)g.remove();document.body.style.overflow='';var tb=document.getElementById('fhsl-topbar');if(tb)tb.style.display='flex';document.body.classList.add('fhsl-liberado');var b=document.getElementById('fhsl-back-hub');if(b)b.style.display='inline-flex';}window.fhslDoLogin=function(){location.replace('index.html')};libera();})();<\/script>`;
    if(!gate.test(html))throw new Error('Bloco legado de autenticação não localizado.');
    html=html.replace(gate,replacement);
    html=html.replace('</body>','<script data-tdngo-light src="tdngo-light-theme-v1.js?v=20260917-0245"><\/script><script data-tdngo-central-nav src="tdngo-central-nav.js?v=20260917-0245"><\/script></body>');
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById('loading').textContent='Falha ao carregar Classificação de Risco: '+e.message;console.error(e)}
})();
</script>
</body></html>
