<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contratos — TDNGo</title>
<style>
html,body{margin:0;min-height:100%;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#loading{min-height:100vh;display:grid;place-items:center;font-size:14px}
</style>
</head>
<body>
<div id="loading">Carregando Contratos...</div>
<script>
(async()=>{
  try{
    const paths=[
      '.tdngo/contratos/part1.txt',
      '.tdngo/contratos/part2.txt',
      '.tdngo/contratos/part3.txt',
      '.tdngo/contratos/part4.txt',
      '.tdngo/contratos/part5.txt'
    ];
    const chunks=await Promise.all(paths.map(p=>fetch(p,{cache:'no-store'}).then(r=>{
      if(!r.ok) throw new Error(p+' HTTP '+r.status);
      return r.text();
    })));
    const b64=chunks.join('').trim();
    const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const ds=new DecompressionStream('gzip');
    const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('loading').textContent='Falha ao carregar Contratos: '+e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>
