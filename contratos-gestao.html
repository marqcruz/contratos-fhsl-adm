<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contratos de Gestão — TDNGo</title><style>html,body{margin:0;min-height:100%;background:#f4f4f2;color:#1a1a18;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}#loading{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center;color:#6b7280}</style></head>
<body><div id="loading">Carregando Contratos de Gestão...</div>
<script>
(async()=>{
 try{
  let sess=null;
  try{sess=JSON.parse(sessionStorage.getItem('fhsl_session')||'null')}catch(e){}
  if(!sess||!sess.tdngoToken){location.replace('index.html');return;}
  const base='https://raw.githubusercontent.com/marqcruz/contratos-fhsl-adm/4a6f1f45767a06a6dd14ba9d9ea04472b609ab9c/contratos-gestao.html';
  const r=await fetch(base,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
  let html=await r.text();
  html=html.replace(/const\s+SCRIPT_URL\s*=\s*'[^']+';/,"const CG_API_URL='https://nsbhhmrhzkqkaoznaeif.supabase.co/functions/v1/tdngo-cg-api';");
  html=html.replace(/\bSCRIPT_URL\b/g,'CG_API_URL');
  html=html.replace(/\bapiFetch\b/g,'cgApi');
  html=html.replace("function isAdmin(){return !!(currentUser&&currentUser.role==='admin');}","function isAdmin(){return !!(currentUser&&['admin','gestor'].includes(String(currentUser.role||'').toLowerCase()));}");
  const oldFn=`async function cgApi(action, payload){
  const r = await fetch(CG_API_URL+'?action='+action, { method:'POST', body: JSON.stringify(payload||{}) });
  const t = await r.text();
  try { return JSON.parse(t); } catch(e){ return { ok:false, message:t }; }
}`;
  const newFn=`async function cgApi(action,payload){
  const tk=(currentUser&&currentUser.tdngoToken)||(()=>{try{return JSON.parse(sessionStorage.getItem('fhsl_session')||'null')?.tdngoToken||''}catch(e){return''}})();
  const headers={'Content-Type':'application/json'};if(tk)headers.Authorization='Bearer '+tk;
  const body=Object.assign({action:action},payload||{});
  const r=await fetch(CG_API_URL,{method:'POST',headers:headers,body:JSON.stringify(body)});
  const t=await r.text();let d;try{d=JSON.parse(t)}catch(e){d={ok:false,message:t||'Resposta inválida'}}
  if(r.status===401&&action!=='authuser'){sessionStorage.removeItem('fhsl_session');}
  return d;
}`;
  if(!html.includes(oldFn))throw new Error('Função de API antiga não localizada para conversão.');
  html=html.replace(oldFn,newFn);
  html=html.replace(/Apps Script v9/g,'API Supabase');
  html=html.replace(/Apps Script/g,'API Supabase');

  // A autenticação é feita pela sessão central do TDNGo.
  // Não renderizar uma segunda tela de login dentro do módulo.
  html=html.replace(/<div class="login-screen" id="login-screen">[\s\S]*?<\/div>\s*<div class="app" id="app"/m,'<div class="app" id="app"');
  html=html.replace("document.getElementById('login-screen').style.display='none';",'');
  html=html.replace(/function doLogout\(\)\{[\s\S]*?\n\}/m,"function doLogout(){sessionStorage.removeItem('fhsl_session');currentUser=null;location.replace('index.html');}");


  // Contratos de Gestão é exclusivamente escuro: remove CSS, botão e persistência do tema claro.
  html=html.replace(/body\\[data-theme="light"\\]\\{[\\s\\S]*?\\}\\s*:root\\{/m,':root{');
  html=html.replace('<div class="topbar-right"><button class="bell-btn" id="theme-btn" onclick="toggleTheme()" title="Tema">🌙</button></div>','<div class="topbar-right"><a class="btn" href="index.html">Central TDNGo</a></div>');
  html=html.replace(/function themeKey\\(\\)\\{[\\s\\S]*?function initials\\(n\\)\\{/m,"function applyTheme(){document.body.removeAttribute('data-theme');}\\nfunction toggleTheme(){applyTheme();}\\nfunction loadUserTheme(){applyTheme();}\\nfunction initials(n){");
  html=html.replace('<div style="margin-top:auto;padding-top:1rem;border-top:1px solid var(--border)">\\n    </div>','<div style="margin-top:auto;padding-top:1rem;border-top:1px solid var(--border)"><a href="index.html" class="btn" style="width:100%;justify-content:center;text-decoration:none">Central TDNGo</a></div>');
  html=html.replace(/<body([^>]*)data-theme="light"([^>]*)>/gi,'<body$1$2>');
  if(html.includes('google.com/macros')||html.includes('SCRIPT'+'_URL')||html.includes('api'+'Fetch('))throw new Error('Referência legada permaneceu no Contratos de Gestão.');
  const bodyClose=html.lastIndexOf('</body>');
  if(bodyClose<0)throw new Error('Fechamento </body> não localizado.');
  const addons='';
  html=html.slice(0,bodyClose)+addons+html.slice(bodyClose);
  document.open();document.write(html);document.close();
 }catch(e){document.getElementById('loading').textContent='Falha ao carregar Contratos de Gestão: '+e.message;console.error(e)}
})();
</script>
</body></html>
