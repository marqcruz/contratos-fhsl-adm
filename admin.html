<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração — TDNGo</title><style>html,body{margin:0;min-height:100%;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}#loading{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center}</style></head>
<body><div id="loading">Carregando Administração...</div>
<script>
(async()=>{
  try{
    const r=await fetch('admin-base-current.html',{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    let html=await r.text();
    html=html.replace('id="tb-users"','id="tb_users"').replace('id="tb-units"','id="tb_units"').replace('id="tb-locals"','id="tb_locals"').replace('id="tb-audit"','id="tb_audit"').replace(/\blogin\(\)/g,'doLogin()');
    html=html.replace('<button class="active" data-page="usuarios" onclick="show(\'usuarios\',this)">👤 Usuários</button>','<button class="active" data-page="usuarios" onclick="show(\'usuarios\',this)">👤 Usuários</button><a href="acessos.html">🔐 Acessos por módulo</a><a href="admin-visitantes.html">🪪 Config. Visitantes</a>');
    html=html.replace('<a class="home" href="index.html">⌂ TDNGo</a>','<a class="home" href="index.html">← Voltar ao TDNGo</a>');
    html=html.replace("['conferencia','📑 Conferência'],['admin','⚙️ Administração']","['conferencia','📑 Conferência'],['documentos','📄 Documentos Internos'],['planejamento_compras','📦 Planejamento de Compras'],['admin','⚙️ Administração']");
    html=html.replace(/<div class="full"><label style="text-transform:none"><input id="uaprova"[\s\S]*?<\/label><\/div>/,'');
    html=html.replace(/uaprova\.checked=bool\(u\?\.AprovaConf\);?/g,'');
    html=html.replace(/,AprovaConf:uaprova\.checked/g,'');
    html=html.replace(/,AprovaConf:bool\(u\.AprovaConf\)/g,'');

    html=html.replace('</style>','<style>.storage-card{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:16px;margin-bottom:15px}.storage-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}.storage-title{font-size:14px;font-weight:800}.storage-value{font-size:25px;font-weight:850;margin-top:3px}.storage-meta{font-size:11px;color:var(--muted);margin-top:3px}.storage-progress{height:12px;background:var(--surface2);border:1px solid var(--border);border-radius:999px;overflow:hidden;margin:12px 0 7px}.storage-progress>div{height:100%;width:0;background:var(--accent);border-radius:999px;transition:.25s}.storage-stats{display:grid;grid-template-columns:repeat(3,minmax(110px,1fr));gap:8px;margin-top:11px}.storage-mini{background:var(--surface2);border-radius:8px;padding:9px 11px}.storage-mini b{display:block;font-size:16px}.storage-mini span{font-size:10px;color:var(--muted)}@media(max-width:650px){.storage-stats{grid-template-columns:1fr 1fr}}</style></style>');
    html=html.replace('<section class="page active" id="p-usuarios"><div class="cards">','<section class="page active" id="p-usuarios"><div class="storage-card" id="storage-card"><div class="storage-head"><div><div class="storage-title">💾 Armazenamento de arquivos</div><div class="storage-value" id="storage-usage">Carregando...</div><div class="storage-meta" id="storage-meta">Consultando Supabase Storage</div></div><button class="btn sm" onclick="loadStorageUsage()">Atualizar</button></div><div class="storage-progress"><div id="storage-bar"></div></div><div class="storage-stats"><div class="storage-mini"><b id="storage-pct">—</b><span>do limite gratuito</span></div><div class="storage-mini"><b id="storage-files">—</b><span>arquivos armazenados</span></div><div class="storage-mini"><b id="storage-pdfs">—</b><span>PDFs armazenados</span></div></div></div><div class="cards">');
    html=html.replace("const AUTH='https://nsbhhmrhzkqkaoznaeif.supabase.co/functions/v1/tdngo-auth-api', ADMIN='https://nsbhhmrhzkqkaoznaeif.supabase.co/functions/v1/tdngo-admin-data-api', AUDIT='https://nsbhhmrhzkqkaoznaeif.supabase.co/functions/v1/tdngo-auditoria-api';","const AUTH='https://nsbhhmrhzkqkaoznaeif.supabase.co/functions/v1/tdngo-auth-api', ADMIN='https://nsbhhmrhzkqkaoznaeif.supabase.co/functions/v1/tdngo-admin-data-api', AUDIT='https://nsbhhmrhzkqkaoznaeif.supabase.co/functions/v1/tdngo-auditoria-api', STORAGE_ADMIN='https://nsbhhmrhzkqkaoznaeif.supabase.co/functions/v1/tdngo-admin-storage-api';");
    html=html.replace("async function loadAll(){try{const r=await post(ADMIN,{action:'bootstrapAdmin'});users=r.usuarios||[];units=r.unidades||[];locals=r.locais||[];renderUsers();renderUnits();renderLocals()}catch(e){toast(e.message,'err')}}","async function loadStorageUsage(){try{const r=await post(STORAGE_ADMIN,{action:'usage'}),d=r.data||{},bytes=Number(d.bytes_total||0),quota=Number(r.quota_bytes||1073741824),pct=quota?bytes/quota*100:0;const fmt=b=>b<1048576?(b/1024).toLocaleString('pt-BR',{maximumFractionDigits:1})+' KB':b<1073741824?(b/1048576).toLocaleString('pt-BR',{maximumFractionDigits:1})+' MB':(b/1073741824).toLocaleString('pt-BR',{maximumFractionDigits:2})+' GB';storage_usage.textContent=fmt(bytes)+' de '+fmt(quota);storage_meta.textContent=(r.plan||'Free')+' · dados reais do Storage';storage_pct.textContent=pct.toLocaleString('pt-BR',{maximumFractionDigits:2})+'%';storage_files.textContent=Number(d.arquivos_total||0).toLocaleString('pt-BR');storage_pdfs.textContent=Number(d.pdfs_total||0).toLocaleString('pt-BR');storage_bar.style.width=Math.max(.3,Math.min(100,pct))+'%';storage_bar.style.background=pct>=90?'var(--red)':pct>=70?'var(--yellow)':'var(--accent)'}catch(e){if(document.getElementById('storage-usage'))storage_usage.textContent='Não foi possível carregar';if(document.getElementById('storage-meta'))storage_meta.textContent=e.message||'Erro ao consultar armazenamento'}}\nasync function loadAll(){loadStorageUsage();try{const r=await post(ADMIN,{action:'bootstrapAdmin'});users=r.usuarios||[];units=r.unidades||[];locals=r.locais||[];renderUsers();renderUnits();renderLocals()}catch(e){toast(e.message,'err')}}");
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById('loading').textContent='Falha ao carregar Administração: '+(e&&e.message?e.message:String(e));console.error(e)}
})();
</script></body></html>
