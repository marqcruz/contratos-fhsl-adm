<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CNES — TDNGo</title><style>html,body{margin:0;min-height:100%;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}#loading{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center}</style></head>
<body><div id="loading">Carregando CNES...</div>
<script>
(async()=>{
  try{
    const r=await fetch('cnes-base-current.html',{cache:'no-store'});
    if(!r.ok) throw new Error('cnes-base-current.html HTTP '+r.status);
    let html=await r.text();

    html=html.replace(
      '<select id="filtro-tipo" onchange="renderTabela()"><option value="">Todos os tipos</option><option value="1">1 - Administrativo</option><option value="2">2 - Médico</option><option value="3">3 - Assistencial</option></select>',
      '<select id="filtro-tipo" onchange="renderTabela()"><option value="">Todos os tipos</option><option value="1">1 - Administrativo</option><option value="2">2 - Médico</option><option value="3">3 - Assistencial</option></select><select id="filtro-cbo" onchange="renderTabela()"><option value="">Todos os CBOs</option></select><select id="ordem-cadastro" onchange="ordenarRapido(this.value)"><option value="nome">Ordenar: nome</option><option value="cad_desc">Cadastro: mais recentes</option><option value="cad_asc">Cadastro: mais antigos</option></select>'
    );

    html=html.replace(
      "const ft=document.getElementById('filtro-tipo').value;\n  const fs=document.getElementById('filtro-status').value;",
      "const ft=document.getElementById('filtro-tipo').value;\n  const fcbo=document.getElementById('filtro-cbo')?document.getElementById('filtro-cbo').value:'';\n  const fs=document.getElementById('filtro-status').value;"
    );
    html=html.replace(
      "if(ft && String(c.Tipo)!==ft) return false;\n    if(fs && (c.Status||'Ativo')!==fs) return false;",
      "if(ft && String(c.Tipo)!==ft) return false;\n    if(fcbo && String(c.CBO)!==fcbo) return false;\n    if(fs && (c.Status||'Ativo')!==fs) return false;"
    );

    let patch=`<script>
(function(){
  const FHSL_CNPJ='13.370.183/0001-89';

  function popularFiltroCbo(){
    const s=document.getElementById('filtro-cbo'); if(!s) return;
    const atual=s.value;
    const itens=(typeof CBOS!=='undefined'?CBOS:[]).slice().sort(function(a,b){return String(a[0]).localeCompare(String(b[0]));});
    s.innerHTML='<option value="">Todos os CBOs</option>'+itens.map(function(x){return '<option value="'+esc(x[0])+'">'+esc(x[0]+' - '+x[1])+'</option>';}).join('');
    if(itens.some(function(x){return String(x[0])===atual;})) s.value=atual;
  }

  async function atualizarListasCnesAgora(){
    try{
      const r=await apiFetch('getcneslistas',{_ts:Date.now()});
      if(r && r.ok && r.listas){
        if(Array.isArray(r.listas.cbos)&&r.listas.cbos.length) CBOS=r.listas.cbos;
        if(Array.isArray(r.listas.conselhos)&&r.listas.conselhos.length) CONSELHOS=r.listas.conselhos;
        if(Array.isArray(r.listas.vinculos)&&r.listas.vinculos.length) VINCULOS=r.listas.vinculos;
        preencherCbos(); preencherConselhos(); preencherVinculos(); popularFiltroCbo();
      }
    }catch(e){ console.warn('Listas CNES não atualizadas',e); }
  }
  window.atualizarListasCnesAgora=atualizarListasCnesAgora;

  const originalCarregarListas=window.carregarListas;
  window.carregarListas=async function(){
    if(originalCarregarListas) await originalCarregarListas();
    await atualizarListasCnesAgora();
  };
  window.addEventListener('focus',atualizarListasCnesAgora);
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') atualizarListasCnesAgora(); });
  setInterval(function(){ if(document.visibilityState==='visible') atualizarListasCnesAgora(); },60000);

  const originalTipoMudou=window.tipoMudou;
  window.tipoMudou=function(){
    if(originalTipoMudou) originalTipoMudou();
    const t=document.getElementById('cd-tipo')?.value;
    const cnpj=document.getElementById('cd-cnpj');
    if(cnpj && (t==='1'||t==='2') && !String(cnpj.value||'').trim()){
      cnpj.value=FHSL_CNPJ;
      if(typeof validarCnpjVisual==='function') validarCnpjVisual();
    }
  };

  document.addEventListener('input',function(ev){
    if(ev.target && ev.target.id==='cd-nome'){
      const ini=ev.target.selectionStart, fim=ev.target.selectionEnd;
      ev.target.value=String(ev.target.value||'').toLocaleUpperCase('pt-BR');
      try{ev.target.setSelectionRange(ini,fim);}catch(e){}
    }
  });

  const originalAbrirCadastro=window.abrirCadastro;
  window.abrirCadastro=function(){
    atualizarListasCnesAgora();
    if(originalAbrirCadastro) originalAbrirCadastro();
    window.tipoMudou();
  };

  const originalEditarCadastro=window.editarCadastro;
  if(originalEditarCadastro) window.editarCadastro=function(){
    atualizarListasCnesAgora();
    return originalEditarCadastro.apply(this,arguments);
  };

  window.ordenarRapido=function(v){
    if(v==='cad_desc'){ ordCampo='CriadoEm'; ordDir=-1; }
    else if(v==='cad_asc'){ ordCampo='CriadoEm'; ordDir=1; }
    else { ordCampo='Nome'; ordDir=1; }
    pagina=1; renderTabela();
  };

  const originalMontarFiltroComp=window.montarFiltroComp;
  window.montarFiltroComp=function(){
    if(originalMontarFiltroComp) originalMontarFiltroComp();
    popularFiltroCbo();
  };

  document.addEventListener('DOMContentLoaded',function(){
    popularFiltroCbo();
    atualizarListasCnesAgora();
  });
})();
__TDNGO_CLOSE_SCRIPT__`;
    patch=patch.replace('__TDNGO_CLOSE_SCRIPT__','</scr'+'ipt>');
    html=html.replace('</body>',patch+'</body>');

    document.open(); document.write(html); document.close();
  }catch(e){document.getElementById('loading').textContent='Falha ao carregar CNES: '+(e&&e.message?e.message:String(e));console.error(e)}
})();
</script></body></html>
