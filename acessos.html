<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acessos por módulo — TDNGo</title>
<style>
:root{--bg:#0d1117;--surface:#161b22;--surface2:#1c2230;--border:#2a3140;--text:#e6edf3;--muted:#9aa7b8;--accent:#3b9eff;--green:#3fb950;--red:#f85149}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:1450px;margin:auto;padding:24px}.top{display:flex;gap:12px;align-items:center;margin-bottom:20px}.top h1{margin:0;font-size:22px}.spacer{flex:1}.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:700;text-decoration:none}.btn:hover{background:var(--surface2)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.layout{display:grid;grid-template-columns:340px 1fr;gap:14px}.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}.head{padding:13px 15px;border-bottom:1px solid var(--border);font-weight:800}.body{padding:14px}.search{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 10px;margin-bottom:10px}.users{max-height:72vh;overflow:auto}.user{padding:10px;border:1px solid transparent;border-radius:8px;cursor:pointer;margin-bottom:5px}.user:hover{background:var(--surface2)}.user.on{background:#15243a;border-color:#27577e}.user b{display:block;font-size:12px}.muted{color:var(--muted);font-size:11px}.empty{padding:26px;text-align:center;color:var(--muted)}.modulebar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.mod{border:1px solid var(--border);background:var(--surface2);color:var(--muted);padding:7px 10px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700}.mod.on{border-color:#27577e;background:#15243a;color:#79c0ff}.access-head{display:flex;align-items:center;gap:10px;padding:12px;background:var(--surface2);border:1px solid var(--border);border-radius:9px;margin-bottom:12px}.switch{display:flex;gap:8px;align-items:center;font-weight:800}.switch input{width:17px;height:17px}.units-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:7px}.unit{display:flex;align-items:flex-start;gap:8px;border:1px solid var(--border);background:var(--surface2);border-radius:8px;padding:9px}.unit input{margin-top:2px}.notice{border:1px solid #27577e;background:#15243a;color:#a9d5ff;border-radius:8px;padding:9px 11px;margin-bottom:12px}.toast{position:fixed;right:18px;bottom:18px;background:#111827;border:1px solid var(--border);padding:10px 13px;border-radius:8px;display:none}.toast.show{display:block}@media(max-width:850px){.layout{grid-template-columns:1fr}.users{max-height:280px}.shell{padding:14px}}
</style>
</head>
<body>
<div class="shell">
 <div class="top"><div><h1>Gestão de acessos por módulo</h1><div class="muted">Usuário → módulo → uma ou mais unidades</div></div><div class="spacer"></div><a class="btn" href="admin.html">← Administração</a><a class="btn" href="index.html">⌂ TDNGo</a></div>
 <div class="layout">
  <div class="card"><div class="head">Usuários</div><div class="body"><input class="search" id="q" placeholder="Buscar usuário..." oninput="renderUsers()"><div class="users" id="users"></div></div></div>
  <div class="card"><div class="head" id="sel-title">Selecione um usuário</div><div class="body" id="editor"><div class="empty">Escolha um usuário à esquerda.</div></div></div>
 </div>
</div><div class="toast" id="toast"></div>
<script>
const API='https://nsbhhmrhzkqkaoznaeif.supabase.co/functions/v1/tdngo-admin-data-api';
const LABELS={contratos:'📋 Contratos',cg:'🏛️ Contratos de Gestão',indicadores:'📊 Indicadores',painel_ubs:'🏥 Painel UBS',painel_upas:'📈 Painel UPAs',cnes:'👥 CNES',seguranca:'🛡️ Segurança',visitantes:'🪪 Visitantes',chaves:'🔑 Chaves',malotes:'📦 Malotes',limpeza:'🧹 Limpeza',conferencia:'📑 Conferência',admin:'⚙️ Administração'};
let sess=null,data={usuarios:[],unidades:[],links:[],modulos:[]},userId='',modulo='';
try{sess=JSON.parse(sessionStorage.getItem('fhsl_session')||'null')}catch{}
if(!sess?.tdngoToken){location.replace('index.html')}else if(sess.role!=='admin'){document.body.innerHTML='<div class="empty">Apenas administradores podem acessar esta página.<br><br><a class="btn" href="index.html">Voltar ao TDNGo</a></div>'}else init();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2600)}
async function api(action,extra={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+sess.tdngoToken},body:JSON.stringify({action,...extra})});let d={};try{d=await r.json()}catch{}if(r.status===401){sessionStorage.removeItem('fhsl_session');location.replace('index.html');throw new Error('Sessão expirada.')}if(!r.ok||!d.ok)throw new Error(d.message||'Falha na operação.');return d}
async function init(){try{const r=await api('accessOverview');data=r.data||data;renderUsers()}catch(e){document.getElementById('users').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function renderUsers(){const q=document.getElementById('q').value.trim().toLowerCase(),arr=data.usuarios.filter(u=>!q||`${u.nome} ${u.email} ${u.role}`.toLowerCase().includes(q));document.getElementById('users').innerHTML=arr.map(u=>`<div class="user ${u.id===userId?'on':''}" onclick="pickUser('${u.id}')"><b>${esc(u.nome)}</b><div class="muted">${esc(u.email)} · ${esc(u.role)}</div></div>`).join('')||'<div class="empty">Nenhum usuário.</div>'}
function enabled(u,m){if(u.role==='admin')return true;const mods=Array.isArray(u.modulos)?u.modulos:[];return !mods.length||mods.includes(m)}
function selectedUnits(uid,m){return new Set(data.links.filter(x=>x.usuario_id===uid&&x.modulo===m).map(x=>x.unidade_id))}
function pickUser(id){userId=id;const u=data.usuarios.find(x=>x.id===id);modulo=data.modulos.find(m=>enabled(u,m))||data.modulos[0]||'';renderUsers();renderEditor()}
function pickModule(m){modulo=m;renderEditor()}
function renderEditor(){const u=data.usuarios.find(x=>x.id===userId);if(!u)return;document.getElementById('sel-title').textContent=u.nome+' · '+u.role;const isAdmin=u.role==='admin',on=enabled(u,modulo),sel=selectedUnits(u.id,modulo);document.getElementById('editor').innerHTML=`<div class="modulebar">${data.modulos.map(m=>`<button class="mod ${m===modulo?'on':''}" onclick="pickModule('${m}')">${esc(LABELS[m]||m)}</button>`).join('')}</div>${isAdmin?'<div class="notice">Administrador possui acesso global a todos os módulos e unidades. Os vínculos abaixo não restringem esse perfil.</div>':''}<div class="access-head"><label class="switch"><input id="habilitado" type="checkbox" ${on?'checked':''} ${isAdmin?'disabled':''}> Módulo habilitado</label><div class="spacer"></div><b>${esc(LABELS[modulo]||modulo)}</b></div><div class="units-head"><b>Unidades</b><div class="spacer"></div><button class="btn" onclick="marcarTodas(true)">Todas</button><button class="btn" onclick="marcarTodas(false)">Nenhuma</button></div><div class="units">${data.unidades.map(x=>`<label class="unit"><input class="uchk" type="checkbox" value="${x.id}" ${sel.has(x.id)?'checked':''}><span><b>${esc(x.nome)}</b><div class="muted">${esc(x.tipo||'Unidade')}</div></span></label>`).join('')}</div><div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="btn primary" onclick="salvar()">Salvar acesso</button></div>`}
function marcarTodas(v){document.querySelectorAll('.uchk').forEach(x=>x.checked=v)}
async function salvar(){const u=data.usuarios.find(x=>x.id===userId);if(!u||!modulo)return;const habilitado=u.role==='admin'?true:document.getElementById('habilitado').checked,ids=[...document.querySelectorAll('.uchk:checked')].map(x=>x.value);try{await api('saveModuleAccess',{usuario_id:u.id,modulo,habilitado,unidade_ids:ids});const r=await api('accessOverview');data=r.data;toast('Acesso atualizado.');renderUsers();renderEditor()}catch(e){toast(e.message)}}
</script>
<script src="tdngo-nav.js"></script>
</body></html>
