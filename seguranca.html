<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Segurança Institucional — TDNGo</title>
<style>
html,body{margin:0;min-height:100%;background:#f4f7fb;color:#172033;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
#loading{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center;color:#657286}
</style>
</head>
<body>
<div id="loading">Carregando Segurança Institucional...</div>
<script>
(async()=>{
  try{
    let sess=null;
    try{sess=JSON.parse(sessionStorage.getItem('fhsl_session')||localStorage.getItem('fhsl_session')||'null')}catch(e){}
    if(!sess||!(sess.tdngoToken||sess.token)){location.replace('index.html');return;}
    const r=await fetch('seguranca-base-current.html?v=20260918-1815',{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const html=await r.text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    const el=document.getElementById('loading');
    if(el)el.textContent='Falha ao carregar Segurança Institucional: '+(e&&e.message?e.message:String(e));
    console.error(e);
  }
})();
</script>
</body>
</html>
