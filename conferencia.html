<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conferência Documental — TDNGo</title>
<style>
html,body{margin:0;min-height:100%;background:#f4f7fa;color:#18222d;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
#loading{min-height:100vh;display:grid;place-items:center;color:#667585}
</style>
</head>
<body>
<div id="loading">Carregando Conferência Documental...</div>
<script>
(async()=>{
  try{
    const loaderUrl='https://raw.githubusercontent.com/marqcruz/contratos-fhsl-adm/0e6ebb5caf15077fb79db59b708a7f3b26ed6ba9/conferencia.html';
    const r=await fetch(loaderUrl,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const src=await r.text();

    const closeScript='</scr'+'ipt>';
    const openTag='<script>';
    const ini=src.indexOf(openTag);
    const fim=src.lastIndexOf(closeScript);
    if(ini<0||fim<=ini) throw new Error('Loader da Conferência inválido.');

    const code=src.slice(ini+openTag.length,fim);
    const nativeWrite=document.write.bind(document);
    const badClose1='<'+String.fromCharCode(92)+'/script>';
    const badClose2='<'+String.fromCharCode(92,92)+'/script>';

    document.write=function(chunk){
      let html=String(chunk==null?'':chunk);
      html=html.split(badClose2).join(closeScript);
      html=html.split(badClose1).join(closeScript);

      const extras='<script data-tdngo-light src="tdngo-light-theme-v1.js?v=20260917-1445">'+closeScript+
        '<script data-tdngo-central-nav src="tdngo-central-nav.js?v=20260917-1445">'+closeScript;
      if(html.includes('</body>')) html=html.replace('</body>',extras+'</body>');

      nativeWrite(html);
    };

    // Executa o JavaScript do loader diretamente, sem fazer o navegador analisar
    // o HTML intermediário. Assim, strings internas com fechamento de script não
    // podem encerrar a tag atual nem aparecer como texto na página.
    new Function(code)();
  }catch(e){
    const el=document.getElementById('loading');
    if(el) el.textContent='Falha ao carregar Conferência: '+(e&&e.message?e.message:e);
    console.error(e);
  }
})();
</script>
</body>
</html>
