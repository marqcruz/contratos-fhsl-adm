name: Reparar paginas TDNGo
on:
  push:
    branches: [layout_gpt]
    paths: ['.tdngo-trigger-nav.txt']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: layout_gpt
          fetch-depth: 0
      - name: Restaurar arquivos antes da injecao quebrada
        shell: bash
        run: |
          git checkout c26253a7967b886b2547a030f8f3cc7ac201063f -- \
            acessos.html \
            admin-base-current.html \
            admin-cnes.html \
            admin.html \
            chaves.html \
            cnes-base-current.html \
            cnes.html \
            conferencia.html \
            conferencia_individual_documentos.html \
            consulta-limpeza.html \
            contratos-base-current.html \
            contratos-gestao.html \
            contratos.html \
            indicador_laboratorial.html \
            indicadores.html \
            indicadores_configuravel_upas.html \
            limpeza.html \
            malotes.html \
            notas_indicadores.html \
            painel-ubs.html \
            painel-upas.html \
            risco.html \
            seguranca.html \
            solicitacao_interna_formulario.html \
            visitantes.html
      - name: Reaplicar acesso por unidade no Visitantes sem wrapper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('visitantes.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzL4toQDT4FSxp4-ytfcE-wMuti0AReZ_msABQGqcXz2Er3N73Jb5cJLHnzyZGXsdRf/exec';\n",'')
          start=s.find('async function apiFetch(action,payload){')
          if start!=-1:
              end=s.find('\n\nasync function visitantesApi',start)
              if end!=-1:
                  s=s[:start]+s[end+2:]
          s=s.replace(
              "let currentUser=null, visitantes=[], config={tipos:[],locais:[],setores:[],motivos:[]}, relDados=[];",
              "let currentUser=null, visitantes=[], config={tipos:[],locais:[],setores:[],motivos:[]}, relDados=[], unidadesAcesso=[];"
          )
          s=s.replace(
              '<div class="fg"><label class="req">Tipo de acesso</label><select id="f-tipo" onchange="tipoMudou()"></select></div>',
              '<div class="fg"><label class="req">Unidade</label><select id="f-unidade"></select></div><div class="fg"><label class="req">Tipo de acesso</label><select id="f-tipo" onchange="tipoMudou()"></select></div>'
          )
          s=s.replace(
              "visitantes=d.visitantes||[];\n    if(d.config)config=d.config;\n    preencherSelecoes();atualizarSugestoes();renderTudo()",
              "visitantes=d.visitantes||[];\n    unidadesAcesso=d.unidades||[];\n    if(d.config)config=d.config;\n    preencherSelecoes();atualizarSugestoes();renderTudo()"
          )
          s=s.replace(
              "fillSelect('f-tipo',config.tipos,true);fillSelect('f-setor',locais,true);fillSelect('f-motivo',config.motivos,false);",
              "const us=document.getElementById('f-unidade');if(us){us.innerHTML=unidadesAcesso.map(u=>`<option value=\"${esc(u.id)}\">${esc(u.nome)}</option>`).join('');us.disabled=unidadesAcesso.length<=1;}fillSelect('f-tipo',config.tipos,true);fillSelect('f-setor',locais,true);fillSelect('f-motivo',config.motivos,false);"
          )
          s=s.replace(
              "document.getElementById('form-title').textContent=v?'Editar registro':'Nova entrada';document.getElementById('f-id').value=v?v.ID:'';",
              "document.getElementById('form-title').textContent=v?'Editar registro':'Nova entrada';document.getElementById('f-id').value=v?v.ID:'';const fu=document.getElementById('f-unidade');if(fu){fu.value=v?.UnidadeId||unidadesAcesso[0]?.id||'';}"
          )
          s=s.replace(
              "const p={\n    Tipo:document.getElementById('f-tipo').value.toUpperCase(),",
              "const p={\n    UnidadeId:document.getElementById('f-unidade')?.value||'',\n    Tipo:document.getElementById('f-tipo').value.toUpperCase(),"
          )
          s=s.replace("if(!p.Tipo||!p.Documento||!p.Nome", "if(!p.UnidadeId||!p.Tipo||!p.Documento||!p.Nome")
          s=s.replace("const items=[['Nome completo',v.Nome]", "const items=[['Unidade',v.Unidade||'—'],['Nome completo',v.Nome]")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Corrigir sessao unica e CNES sem wrapper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # INDEX: após substituir o login antigo pelo novo, propaga sessão também em localStorage.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker="if(!html.includes(old))throw new Error('Bloco de login não localizado.');html=html.replace(old,neu);"
          patch="""if(!html.includes(old))throw new Error('Bloco de login não localizado.');html=html.replace(old,neu);\n html=html.replace(/sessionStorage\\.getItem\\('fhsl_session'\\)/g,\"(sessionStorage.getItem('fhsl_session')||localStorage.getItem('fhsl_session'))\");\n html=html.replace(/sessionStorage\\.setItem\\('fhsl_session',JSON\\.stringify\\(currentUser\\)\\);/g,\"sessionStorage.setItem('fhsl_session',JSON.stringify(currentUser));localStorage.setItem('fhsl_session',JSON.stringify(currentUser));\");\n html=html.replace(/sessionStorage\\.removeItem\\('fhsl_session'\\);/g,\"sessionStorage.removeItem('fhsl_session');localStorage.removeItem('fhsl_session');\");"""
          if marker in s:
              s=s.replace(marker,patch)
          p.write_text(s,encoding='utf-8')

          # CONTRATOS: wrapper pode perder DOMContentLoaded. Executa init após document.write e usa fallback persistente.
          p=Path('contratos.html')
          s=p.read_text(encoding='utf-8')
          before='    document.open(); document.write(html); document.close();'
          insert="""    html=html.replace(\"window.addEventListener('DOMContentLoaded', function(){\",\"setTimeout(function(){\");\n    html=html.replace(\"const sess = sessionStorage.getItem('fhsl_session');\",\"const sess = sessionStorage.getItem('fhsl_session') || localStorage.getItem('fhsl_session'); if(sess&&!sessionStorage.getItem('fhsl_session')) sessionStorage.setItem('fhsl_session',sess);\");\n    html=html.replace(/sessionStorage\\.removeItem\\('fhsl_session'\\);/g,\"sessionStorage.removeItem('fhsl_session');localStorage.removeItem('fhsl_session');\");\n    document.open(); document.write(html); document.close();"""
          if before in s:
              s=s.replace(before,insert)
          p.write_text(s,encoding='utf-8')

          # LIMPEZA: usa sessão central também entre abas.
          p=Path('limpeza.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("sessionStorage.setItem('fhsl_session', JSON.stringify(currentUser));","sessionStorage.setItem('fhsl_session', JSON.stringify(currentUser)); localStorage.setItem('fhsl_session', JSON.stringify(currentUser));")
          s=s.replace("sessionStorage.removeItem('fhsl_session'); currentUser=null;","sessionStorage.removeItem('fhsl_session'); localStorage.removeItem('fhsl_session'); currentUser=null;")
          s=s.replace("const s=sessionStorage.getItem('fhsl_session');","const s=sessionStorage.getItem('fhsl_session')||localStorage.getItem('fhsl_session'); if(s&&!sessionStorage.getItem('fhsl_session')) sessionStorage.setItem('fhsl_session',s);")
          p.write_text(s,encoding='utf-8')

          # VISITANTES: mesma sessão central; em 401 limpa as duas cópias.
          p=Path('visitantes.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("try{sessionStorage.removeItem('fhsl_session')}catch(e){}","try{sessionStorage.removeItem('fhsl_session');localStorage.removeItem('fhsl_session')}catch(e){}")
          s=s.replace("sessionStorage.setItem('fhsl_session',JSON.stringify(currentUser));","sessionStorage.setItem('fhsl_session',JSON.stringify(currentUser));localStorage.setItem('fhsl_session',JSON.stringify(currentUser));")
          s=s.replace("function doLogout(){sessionStorage.removeItem('fhsl_session');currentUser=null;","function doLogout(){sessionStorage.removeItem('fhsl_session');localStorage.removeItem('fhsl_session');currentUser=null;")
          s=s.replace("const s=sessionStorage.getItem('fhsl_session');if(!s)return;","const s=sessionStorage.getItem('fhsl_session')||localStorage.getItem('fhsl_session');if(!s)return;if(!sessionStorage.getItem('fhsl_session'))sessionStorage.setItem('fhsl_session',s);")
          p.write_text(s,encoding='utf-8')

          # CNES base: sessão compartilhada. CNES passa a abrir diretamente a base, sem document.write.
          p=Path('cnes-base-current.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("sessionStorage.getItem('fhsl_session')","(sessionStorage.getItem('fhsl_session')||localStorage.getItem('fhsl_session'))")
          s=s.replace("sessionStorage.setItem('fhsl_session',JSON.stringify({user:r.user,tdngoToken:r.token}))","sessionStorage.setItem('fhsl_session',JSON.stringify({user:r.user,tdngoToken:r.token}));localStorage.setItem('fhsl_session',JSON.stringify({user:r.user,tdngoToken:r.token}))")
          s=s.replace("sessionStorage.removeItem('fhsl_session')","sessionStorage.removeItem('fhsl_session');localStorage.removeItem('fhsl_session')")
          p.write_text(s,encoding='utf-8')

          Path('cnes.html').write_text('''<!doctype html>\n<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CNES — TDNGo</title><meta http-equiv="refresh" content="0;url=cnes-base-current.html"></head><body style="background:#0d1117;color:#e6edf3;font-family:system-ui"><p>Carregando CNES...</p><script>location.replace("cnes-base-current.html")<\\/script></body></html>''',encoding='utf-8')

          for f in ['visitantes.html','limpeza.html','contratos.html','cnes-base-current.html']:
              txt=Path(f).read_text(encoding='utf-8')
              if 'script.google.com' in txt and f in ['visitantes.html']:
                  raise SystemExit(f'{f} ainda contém Apps Script')
          PY
      - name: Commit da reparacao
        run: |
          git config user.name "TDNGo Automation"
          git config user.email "actions@users.noreply.github.com"
          git add '*.html'
          git commit -m "TDNGo: restaura paginas, corrige SSO e CNES" || exit 0
          git push origin layout_gpt
