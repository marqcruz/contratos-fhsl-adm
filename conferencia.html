<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conferência Documental — TDNGo</title><style>html,body{margin:0;min-height:100%;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}#initial{min-height:100vh;display:grid;place-items:center;color:#9aa7b8;padding:20px;text-align:center}</style></head><body><div id="initial">Carregando Conferência Documental...</div><script>
(async()=>{try{
 const base='https://raw.githubusercontent.com/marqcruz/contratos-fhsl-adm/fa56cf4de159f6b36945994d55909ab9a892c0d1/conferencia.html';
 const r=await fetch(base,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let html=await r.text();
 html=html.replace("const OPERACIONAL_API_URL = 'https://nsbhhmrhzkqkaoznaeif.supabase.co/functions/v1/tdngo-operacional-api';","const OPERACIONAL_API_URL = 'https://nsbhhmrhzkqkaoznaeif.supabase.co/functions/v1/tdngo-operacional-api';\nconst CONFERENCIA_PDF_API_URL = 'https://nsbhhmrhzkqkaoznaeif.supabase.co/functions/v1/tdngo-conferencia-pdf-api';");
 html=html.replace('Os PDFs permanecem apenas nesta sessão do navegador. Ao fechar, atualizar, sair desta tela ou concluir a conferência, todos os anexos serão perdidos.','Os PDFs anexados para conferência permanecem apenas nesta sessão do navegador. Ao concluir, o PDF final compilado será arquivado no TDNGo; os anexos individuais da sessão serão descartados.');
 html=html.replace("document.getElementById('compilar-status').textContent='Os PDFs não ficam salvos — reanexe se for compilar novamente.';","document.getElementById('compilar-status').textContent='Os anexos individuais não ficam salvos — reanexe se for compilar novamente. O PDF final de conferências concluídas permanece arquivado.';");
 const pdfApi=`async function conferenciaPdfApi(action,extra){
  if(!currentUser||!currentUser.tdngoToken)return {ok:false,message:'Sessão sem token do TDNGo.'};
  try{
    const rr=await fetch(CONFERENCIA_PDF_API_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+currentUser.tdngoToken},body:JSON.stringify(Object.assign({action:action},extra||{}))});
    const txt=await rr.text();let d;try{d=JSON.parse(txt)}catch(e){d={ok:false,message:txt||('HTTP '+rr.status)}}
    if(!rr.ok&&!d.message)d.message='HTTP '+rr.status;return d;
  }catch(e){return {ok:false,message:'Falha de conexão ao consultar o PDF final.'};}
}
async function conferenciaPdfUpload(id,blob,fileName){
  if(!currentUser||!currentUser.tdngoToken)return {ok:false,message:'Sessão sem token do TDNGo.'};
  try{
    const rr=await fetch(CONFERENCIA_PDF_API_URL,{method:'POST',headers:{'Content-Type':'application/pdf','Authorization':'Bearer '+currentUser.tdngoToken,'x-conferencia-id':String(id),'x-file-name':encodeURIComponent(fileName)},body:blob});
    const txt=await rr.text();let d;try{d=JSON.parse(txt)}catch(e){d={ok:false,message:txt||('HTTP '+rr.status)}}
    if(!rr.ok&&!d.message)d.message='HTTP '+rr.status;return d;
  }catch(e){return {ok:false,message:'Falha de conexão ao arquivar o PDF final.'};}
}
async function abrirPdfSalvo(id){
  const r=await conferenciaPdfApi('url',{id:id});
  if(r.ok&&r.url)window.open(r.url,'_blank');else showNotif(r.message||'PDF final não encontrado.','err');
}`;
 html=html.replace('async function operacionalApi(action, payload, autenticado){',pdfApi+'\n\nasync function operacionalApi(action, payload, autenticado){');
 const old=`  showNotif('Salvando...','info');
  const r=await operacionalApi('save_conferencia',{payload:payload});
  if(r.ok){
    showNotif('Conferência concluída.','ok');
    editId=null; conferenciaEmEdicao=false; permitindoSaida=true; anexos={};
    if(pdfFinalUrl){ try{URL.revokeObjectURL(pdfFinalUrl);}catch(e){} }
    pdfFinalUrl=''; pdfFinalBlob=null; pdfFinalGerado=false; pdfFinalBaixado=false;
    fecharPreviewPdf(); carregar(); showPage('lista'); permitindoSaida=false; atualizarEtapasConferencia();
  }
  else showNotif(r.message||'Erro ao salvar.','err');`;
 const neu=`  showNotif('Salvando conferência e arquivando PDF final...','info');
  const inicial=Object.assign({},payload,{Status:'Em conferência'});
  const r=await operacionalApi('save_conferencia',{payload:inicial});
  if(r.ok){
    const confId=r.id||editId;
    if(!pdfFinalBlob){ showNotif('PDF final indisponível. Compile novamente antes de concluir.','err'); editId=confId; return; }
    const emp=(payload.Empresa||'EMPRESA').replace(/[^a-zA-Z0-9_-]+/g,'_').slice(0,70), comp=String(payload.MesRef||'').replace(/[^0-9-]/g,'');
    const nomePdf='Conferencia_'+emp+'_'+comp+'.pdf';
    const up=await conferenciaPdfUpload(confId,pdfFinalBlob,nomePdf);
    if(!up.ok){ showNotif('Conferência não foi concluída: '+(up.message||'falha ao arquivar o PDF final.'),'err'); editId=confId; return; }
    const finalPayload=Object.assign({},payload,{ID:confId,Status:'Concluída'});
    const rf=await operacionalApi('save_conferencia',{payload:finalPayload});
    if(!rf.ok){ showNotif('PDF arquivado, mas não foi possível concluir o registro: '+(rf.message||'erro'),'err'); editId=confId; return; }
    showNotif('Conferência concluída e PDF final arquivado no TDNGo.','ok');
    editId=null; conferenciaEmEdicao=false; permitindoSaida=true; anexos={};
    if(pdfFinalUrl){ try{URL.revokeObjectURL(pdfFinalUrl);}catch(e){} }
    pdfFinalUrl=''; pdfFinalBlob=null; pdfFinalGerado=false; pdfFinalBaixado=false;
    fecharPreviewPdf(); carregar(); showPage('lista'); permitindoSaida=false; atualizarEtapasConferencia();
  }
  else showNotif(r.message||'Erro ao salvar.','err');`;
 if(!html.includes(old))throw new Error('Fluxo de conclusão da Conferência não localizado.');html=html.replace(old,neu);
 html=html.replace("let acoes=(podeEditar()?'<button class=\"btn sm\" onclick=\"editarConf(\\''+c.ID+'\\')\" title=\"Editar/ver\">✏️</button>':'<button class=\"btn sm\" onclick=\"editarConf(\\''+c.ID+'\\')\">👁️</button>');","let acoes=(podeEditar()?'<button class=\"btn sm\" onclick=\"editarConf(\\''+c.ID+'\\')\" title=\"Editar/ver\">✏️</button>':'<button class=\"btn sm\" onclick=\"editarConf(\\''+c.ID+'\\')\">👁️</button>'); if(c.Status==='Concluída'||c.Status==='Aprovada') acoes+=' <button class=\"btn sm\" onclick=\"abrirPdfSalvo(\\''+c.ID+'\\')\" title=\"Abrir PDF final arquivado\">📎</button>'; ");
 document.open();document.write(html);document.close();
}catch(e){document.getElementById('initial').textContent='Falha ao carregar Conferência: '+(e&&e.message?e.message:String(e));console.error(e)}})();
</script></body></html>
