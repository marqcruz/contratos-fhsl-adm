<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CNES — TDNGo</title>
<style>
html,body{margin:0;min-height:100%;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#loading{min-height:100vh;display:grid;place-items:center;font-size:14px;padding:20px;text-align:center}
</style>
</head>
<body>
<div id="loading">Carregando CNES...</div>
<script>
(async()=>{
  try{
    const base='https://raw.githubusercontent.com/marqcruz/contratos-fhsl-adm/layout_gpt/.tdngo/cnes/';
    const paths=['part1.txt','part2.txt','part3.txt'];
    const chunks=await Promise.all(paths.map(p=>fetch(base+p,{cache:'no-store'}).then(r=>{
      if(!r.ok) throw new Error(p+' HTTP '+r.status);
      return r.text();
    })));
    const b64=chunks.join('').trim();
    const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const ds=new DecompressionStream('gzip');
    const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('loading').textContent='Falha ao carregar CNES: '+e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>
