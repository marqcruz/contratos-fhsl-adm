<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Segurança Institucional — TDNGo</title><style>html,body{margin:0;min-height:100%;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}#loading{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center}</style></head>
<body><div id="loading">Carregando Segurança...</div><script>
(async()=>{try{
 const base='https://raw.githubusercontent.com/marqcruz/contratos-fhsl-adm/a3a45ed9045cb27c196e05409660ff6fcca326e1/seguranca.html';
 const r=await fetch(base,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let html=await r.text();
 const oldBoot="async function bootstrap(){try{const r=await api('bootstrap');ocorrencias=r.data.ocorrencias||[];unidades=r.data.unidades||[];user=r.data.user||{};$('who').textContent=`${user.nome||''} · ${user.fullAccess?'Visão gerencial completa':user.unidade||'Unidade não vinculada'}`;$('scope-note').textContent=user.fullAccess?'Você possui visão completa de todas as unidades.':'Acesso restrito às ocorrências da sua unidade: '+(user.unidade||'não vinculada');$('tab-gestao').style.display=user.fullAccess?'inline-block':'none';$('f-unidade-wrap').style.display=user.fullAccess?'block':'none';preencheUnidades();renderTabela();renderGestao()}catch(e){toast(e.message);$('scope-note').textContent=e.message}}";
 const newBoot="async function bootstrap(){try{const r=await api('bootstrap');ocorrencias=r.data.ocorrencias||[];unidades=r.data.unidades||[];user=r.data.user||{};const n=unidades.length;$('who').textContent=`${user.nome||''} · ${user.fullAccess?'Visão gerencial completa':n===1?unidades[0].nome:n+' unidades vinculadas'}`;$('scope-note').textContent=user.fullAccess?'Você possui visão completa de todas as unidades.':n?('Acesso restrito às unidades vinculadas: '+unidades.map(x=>x.nome).join(', ')):'Nenhuma unidade vinculada ao módulo Segurança.';$('tab-gestao').style.display=user.fullAccess?'inline-block':'none';$('f-unidade-wrap').style.display=(user.fullAccess||n>1)?'block':'none';preencheUnidades();renderTabela();renderGestao()}catch(e){toast(e.message);$('scope-note').textContent=e.message}}";
 if(!html.includes(oldBoot))throw new Error('Bootstrap da Segurança não localizado.');html=html.replace(oldBoot,newBoot);
 const oldUnits="function preencheUnidades(){const opts=unidades.map(u=>`<option value=\"${u.id}\">${esc(u.nome)}</option>`).join('');$('f-unidade').innerHTML='<option value=\"\">Todas</option>'+opts;$('n-unidade').innerHTML=opts;if(!user.fullAccess&&user.unidadeId){$('n-unidade').value=user.unidadeId;$('n-unidade').disabled=true}else $('n-unidade').disabled=false}";
 const newUnits="function preencheUnidades(){const opts=unidades.map(u=>`<option value=\"${u.id}\">${esc(u.nome)}</option>`).join('');$('f-unidade').innerHTML='<option value=\"\">Todas</option>'+opts;$('n-unidade').innerHTML=opts;if(!user.fullAccess&&unidades.length===1){$('n-unidade').value=unidades[0].id;$('n-unidade').disabled=true}else $('n-unidade').disabled=false}";
 if(!html.includes(oldUnits))throw new Error('Seletor de unidades não localizado.');html=html.replace(oldUnits,newUnits);

 html=html.replace('<div class="section-title">Fotos / evidências</div><div class="photo-input"><input type="file" id="n-fotos" accept="image/jpeg,image/png,image/webp" multiple><div class="sub">Até 6 imagens, máximo de 5 MB cada.</div></div>','<div class="section-title">Fotos / evidências</div><div class="photo-input"><input type="file" id="n-fotos" accept="image/jpeg,image/png,image/webp" multiple><div class="sub">Até 6 imagens, máximo de 5 MB cada.</div></div><div class="section-title">Boletim de Ocorrência</div><div class="photo-input"><input type="file" id="n-bo" accept="application/pdf,.pdf"><div class="sub">Opcional. Anexe o Boletim de Ocorrência em PDF, máximo de 10 MB.</div></div>');
 html=html.replace('<div class="modal" id="modal-form"><div class="box"><div class="box-head"><b>Nova ocorrência</b>','<div class="modal" id="modal-form"><div class="box"><div class="box-head"><b id="form-title">Nova ocorrência</b>');
 html=html.replace('<button class="btn primary" id="btn-save-new" onclick="salvarNova()">Registrar ocorrência</button>','<button class="btn primary" id="btn-save-new" onclick="salvarNova()">Registrar ocorrência</button>');
 html=html.replace("$('n-fotos').value='';$('env-list').innerHTML=''","$('n-fotos').value='';if($('n-bo'))$('n-bo').value='';$('env-list').innerHTML=''");

 html=html.replace("let sess=null,user=null,ocorrencias=[],unidades=[],atual=null;","let sess=null,user=null,ocorrencias=[],unidades=[],atual=null,editandoId='';");
 const novaOld="function novaOcorrencia(){const d=new Date(Date.now()-new Date().getTimezoneOffset()*60000);$('n-data').value=d.toISOString().slice(0,16);$('n-grav').value='BAIXA';$('n-tipo').selectedIndex=0;$('n-local').value='';$('n-ext').value='NÃO';$('n-desc').value='';$('n-dano').value='NÃO';$('n-valor').value=0;$('n-valor-wrap').style.display='none';$('n-fotos').value='';$('env-list').innerHTML='';addEnv();if(!user.fullAccess&&user.unidadeId)$('n-unidade').value=user.unidadeId;$('modal-form').classList.add('open')}";
 const novaNew="function novaOcorrencia(){editandoId='';$('form-title').textContent='Nova ocorrência';$('btn-save-new').textContent='Registrar ocorrência';const d=new Date(Date.now()-new Date().getTimezoneOffset()*60000);$('n-data').value=d.toISOString().slice(0,16);$('n-grav').value='BAIXA';$('n-tipo').selectedIndex=0;$('n-local').value='';$('n-ext').value='NÃO';$('n-desc').value='';$('n-dano').value='NÃO';$('n-valor').value=0;$('n-valor-wrap').style.display='none';$('n-fotos').value='';if($('n-bo'))$('n-bo').value='';$('env-list').innerHTML='';addEnv();if(!user.fullAccess&&user.unidadeId)$('n-unidade').value=user.unidadeId;$('modal-form').classList.add('open')}\nfunction editarOcorrencia(id){const o=ocorrencias.find(x=>x.ID===id);if(!o||!['gestor','admin'].includes(String(user?.role||'').toLowerCase()))return;editandoId=id;$('form-title').textContent='Editar ocorrência · '+o.Numero;$('btn-save-new').textContent='Salvar alterações';const d=new Date(o.Data);$('n-data').value=isNaN(d.getTime())?'':new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);$('n-unidade').value=o.UnidadeId||'';$('n-grav').value=o.Gravidade||'BAIXA';$('n-tipo').value=o.Tipo||'OUTRO';$('n-local').value=o.Local||'';$('n-ext').value=o.Externo||'NÃO';$('n-desc').value=o.Descricao||'';$('n-dano').value=o.Dano||'NÃO';$('n-valor').value=o.Valor||0;$('n-valor-wrap').style.display=o.Dano==='SIM'?'block':'none';$('n-fotos').value='';if($('n-bo'))$('n-bo').value='';$('env-list').innerHTML='';(o.Envolvidos?.length?o.Envolvidos:[{}]).forEach(addEnv);closeModal('modal-detail');$('modal-form').classList.add('open')}";
 if(!html.includes(novaOld))throw new Error('Função de nova ocorrência não localizada.');html=html.replace(novaOld,novaNew);

 const saveOld="async function salvarNova(){const b=$('btn-save-new');b.disabled=true;try{const payload={Data:$('n-data').value,UnidadeId:$('n-unidade').value,Gravidade:$('n-grav').value,Tipo:$('n-tipo').value,Local:$('n-local').value.trim(),Externo:$('n-ext').value,Descricao:$('n-desc').value.trim(),Dano:$('n-dano').value,Valor:$('n-valor').value,Envolvidos:getEnvs()};const r=await api('save',{payload});const fs=[...$('n-fotos').files].slice(0,6);for(const f of fs){if(f.size>5*1024*1024)throw new Error(`${f.name}: máximo de 5 MB.`);await api('uploadAttachment',{ocorrenciaId:r.id,nome:f.name,mimeType:f.type,base64:await file64(f)})}closeModal('modal-form');await bootstrap();toast('Ocorrência '+r.numero+' registrada como ABERTA.')}catch(e){toast(e.message)}finally{b.disabled=false}}";
 const saveNew="async function salvarNova(){const b=$('btn-save-new');b.disabled=true;try{const anterior=editandoId?ocorrencias.find(x=>x.ID===editandoId):null;const payload={ID:editandoId||'',Data:$('n-data').value,UnidadeId:$('n-unidade').value,Gravidade:$('n-grav').value,Tipo:$('n-tipo').value,Local:$('n-local').value.trim(),Externo:$('n-ext').value,Descricao:$('n-desc').value.trim(),Dano:$('n-dano').value,Valor:$('n-valor').value,Envolvidos:getEnvs(),Status:anterior?.Status||'ABERTA',Responsavel:anterior?.Responsavel||'',Prazo:anterior?.Prazo||'',Providencias:anterior?.Providencias||'',Conclusao:anterior?.Conclusao||''};const r=await api('save',{payload});const fs=[...$('n-fotos').files].slice(0,6);for(const f of fs){if(f.size>5*1024*1024)throw new Error(`${f.name}: máximo de 5 MB.`);await api('uploadAttachment',{ocorrenciaId:r.id,nome:f.name,mimeType:f.type,base64:await file64(f)})}const bo=$('n-bo')?.files?.[0];if(bo){if(bo.type!=='application/pdf'&&!/\\.pdf$/i.test(bo.name))throw new Error('O Boletim de Ocorrência deve ser um PDF.');if(bo.size>10*1024*1024)throw new Error('O Boletim de Ocorrência deve ter no máximo 10 MB.');await boApi({action:'uploadBo',ocorrenciaId:r.id,nome:bo.name,base64:await file64(bo)})}const foiEdicao=!!editandoId;editandoId='';closeModal('modal-form');await bootstrap();toast(foiEdicao?'Ocorrência atualizada.':'Ocorrência '+r.numero+' registrada como ABERTA.')}catch(e){toast(e.message)}finally{b.disabled=false}}";
 if(!html.includes(saveOld))throw new Error('Fluxo de salvamento da ocorrência não localizado.');html=html.replace(saveOld,saveNew);
 html=html.replace("async function salvarNova(){","const BO_API='https://nsbhhmrhzkqkaoznaeif.supabase.co/functions/v1/tdngo-seguranca-bo-api';\nasync function boApi(body){const r=await fetch(BO_API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(body)});let d={};try{d=await r.json()}catch{}if(r.status===401){sessionStorage.removeItem('fhsl_session');localStorage.removeItem('fhsl_session');location.replace('index.html');throw new Error('Sessão expirada.')}if(!r.ok||!d.ok)throw new Error(d.message||'Falha ao anexar o Boletim de Ocorrência.');return d}\nasync function salvarNova(){");

 html=html.replace('<div class="section-title">Fotos</div><div id="d-gallery" class="gallery"></div>','<div class="section-title">Anexos / evidências</div><div id="d-gallery" class="gallery"></div>');
 const fotosOld="function renderFotos(arr){$('d-gallery').innerHTML=arr.length?arr.map(a=>`<div class=\"photo\"><img src=\"${a.Url}\" alt=\"Evidência\" onclick=\"window.open(this.src,'_blank')\"><div class=\"meta\">${esc(a.Nome)}</div></div>`).join(''):'<div class=\"sub\">Nenhuma foto anexada.</div>'}";
 const fotosNew="function corrigirUrlAnexo(u){u=String(u||'');if(!u)return u;return u.replace('https://nsbhhmrhzkqkaoznaeif.supabase.co/object/sign/','https://nsbhhmrhzkqkaoznaeif.supabase.co/storage/v1/object/sign/')}function renderFotos(arr){arr=(arr||[]).map(a=>({...a,Url:corrigirUrlAnexo(a.Url)}));$('d-gallery').innerHTML=arr.length?arr.map(a=>a.Mime==='application/pdf'?`<div class=\"photo\"><div style=\"height:120px;display:grid;place-items:center;font-size:38px;background:var(--surface2);cursor:pointer\" onclick=\"window.open('${a.Url}','_blank')\">📄</div><div class=\"meta\"><b>Boletim de Ocorrência</b><br>${esc(a.Nome)}<br><a href=\"${a.Url}\" target=\"_blank\" rel=\"noopener\">Abrir PDF</a></div></div>`:`<div class=\"photo\"><img src=\"${a.Url}\" alt=\"Evidência\" onclick=\"window.open(this.src,'_blank')\"><div class=\"meta\">${esc(a.Nome)}</div></div>`).join(''):'<div class=\"sub\">Nenhum anexo informado.</div>'}";
 if(!html.includes(fotosOld))throw new Error('Galeria de anexos não localizada.');html=html.replace(fotosOld,fotosNew);

 const detalheOld="$('tratativa').style.display=user.fullAccess?'block':'none';$('btn-tratar').style.display=user.fullAccess?'inline-flex':'none';if(user.fullAccess){";
 const detalheNew="$('tratativa').style.display=user.fullAccess?'block':'none';$('btn-tratar').style.display=user.fullAccess?'inline-flex':'none';const foot=$('btn-tratar')?.parentElement;if(foot){let be=$('btn-editar-oc'),bd=$('btn-excluir-oc');if(!be){be=document.createElement('button');be.id='btn-editar-oc';be.className='btn';be.textContent='✏ Editar ocorrência';be.onclick=()=>editarOcorrencia(atual.ID);foot.insertBefore(be,$('btn-tratar'))}if(!bd){bd=document.createElement('button');bd.id='btn-excluir-oc';bd.className='btn danger';bd.textContent='🗑 Excluir ocorrência';bd.onclick=()=>excluirOcorrencia(atual.ID);foot.insertBefore(bd,$('btn-tratar'))}be.style.display=['gestor','admin'].includes(String(user?.role||'').toLowerCase())?'inline-flex':'none';bd.style.display=String(user?.role||'').toLowerCase()==='admin'?'inline-flex':'none'}if(user.fullAccess){";
 if(!html.includes(detalheOld))throw new Error('Controles do detalhe não localizados.');html=html.replace(detalheOld,detalheNew);

 const tratarOld="async function salvarTratativa(){if(!atual||!user.fullAccess)return;try{const payload={...atual,Data:new Date(atual.Data).toISOString().slice(0,16),Status:$('t-status').value,Responsavel:$('t-resp').value,Prazo:$('t-prazo').value,Providencias:$('t-prov').value,Conclusao:$('t-conc').value,Envolvidos:atual.Envolvidos||[]};await api('save',{payload});closeModal('modal-detail');await bootstrap();toast('Tratativa atualizada.')}catch(e){toast(e.message)}}";
 const tratarNew=tratarOld+"\nasync function excluirOcorrencia(id){if(String(user?.role||'').toLowerCase()!=='admin')return;const o=ocorrencias.find(x=>x.ID===id);if(!o)return;if(!confirm('Excluir definitivamente a ocorrência '+o.Numero+'?\\n\\nOs anexos vinculados também serão removidos. Esta ação não poderá ser desfeita.'))return;try{await api('delete',{id});closeModal('modal-detail');await bootstrap();toast('Ocorrência '+o.Numero+' excluída.')}catch(e){toast(e.message)}}";
 if(!html.includes(tratarOld))throw new Error('Fluxo de tratativa não localizado.');html=html.replace(tratarOld,tratarNew);

 html=html.replace('<a class="home" href="index.html">⌂ TDNGo</a>','<a class="home" href="index.html">← Voltar ao TDNGo</a>');
 document.open();document.write(html);document.close();
}catch(e){document.getElementById('loading').textContent='Falha ao carregar Segurança: '+e.message;console.error(e)}})();
</script></body></html>
