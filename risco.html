<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Classificação de Risco — TDNGo</title><style>html,body{margin:0;min-height:100%;background:#f4f7fa;color:#18222d;font-family:system-ui,sans-serif;color-scheme:light}#loading{min-height:100vh;display:grid;place-items:center;color:#667585;padding:24px;text-align:center}</style></head>
<body><div id="loading">Carregando Classificação de Risco...</div>
<script>
(async()=>{
  try{
    let sess=null;try{sess=JSON.parse(sessionStorage.getItem('fhsl_session')||localStorage.getItem('fhsl_session')||'null')}catch(e){}
    if(!sess){location.replace('index.html');return}
    const mods=Array.isArray(sess.modulos)?sess.modulos:String(sess.modulos||'').split(',').map(x=>x.trim()).filter(Boolean);
    const role=String(sess.role||'').toLowerCase();
    const permitido=role==='admin'||!mods.length||mods.includes('risco')||mods.includes('indicadores');
    if(!permitido){document.getElementById('loading').textContent='Seu usuário não possui acesso ao módulo Classificação de Risco.';return}
    const base='https://raw.githubusercontent.com/marqcruz/contratos-fhsl-adm/525fa254ffa22b62110fe84ceb64c3ac313a5d03/risco.html';
    const r=await fetch(base,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
    let html=await r.text();
    html=html.replace('.prio .fill{height:100%;border-radius:6px;width:0;', '.prio .fill{display:block;height:100%;border-radius:6px;width:0;');
    html=html.replace("const cls=r.ind===hlKey?' class=\"hl-'+hlKey+'\"':'';", "const cls='';");
    html=html.replace('<th>LIMITE (MIN)</th><th>ATINGE</th><th>% INDICADOR</th><th>META</th>', '<th>LIMITE (MIN)</th><th>ATINGE</th><th>% DESEMPENHO</th><th>META</th>');
    html=html.replace('<div class="pdf-block"><div class="pdf-h2">Indicador de desempenho '+"'+num+'"+'</div>'+"'+pdfIndicadorTabela()+'"+'</div>', '<div class="pdf-block"><div class="pdf-h2">Desempenho por prioridade</div>'+"'+pdfIndicadorTabela()+'"+'</div>');
    html=html.replace('table.pdf-t tr.hl-1 td{ background:#2f6fb0; color:#fff; }', 'table.pdf-t tr.hl-1 td{ background:#fff; color:#222; }');
    html=html.replace('table.pdf-t tr.hl-2 td{ background:#3f9d6a; color:#fff; }', 'table.pdf-t tr.hl-2 td{ background:#fff; color:#222; }');
    html=html.replace('table.pdf-t tr.hl-3 td{ background:#e0a021; color:#000; }', 'table.pdf-t tr.hl-3 td{ background:#fff; color:#222; }');
    const gate=/<script>\s*\(function\(\)\{\s*var SCRIPT_URL='https:\/\/script\.google\.com[\s\S]*?<\/script>/;
    const replacement=`<script>(function(){function libera(){var g=document.getElementById('fhsl-gate');if(g)g.remove();document.body.style.overflow='';var tb=document.getElementById('fhsl-topbar');if(tb)tb.style.display='flex';document.body.classList.add('fhsl-liberado');var b=document.getElementById('fhsl-back-hub');if(b)b.style.display='inline-flex';}window.fhslDoLogin=function(){location.replace('index.html')};libera();})();<\/script>`;
    if(!gate.test(html))throw new Error('Bloco legado de autenticação não localizado.');
    html=html.replace(gate,replacement);
    html=html.replace('</head>','<style id="tdngo-standard-return-style">.sidebar-footer{margin-top:auto;padding-top:1rem;border-top:1px solid var(--border,#ddd9cd)}.sidebar-home{display:flex;align-items:center;justify-content:center;width:100%;min-height:36px;padding:8px 12px;border:1px solid var(--border,#ddd9cd);border-radius:8px;background:var(--surface2,#f7f9fb);color:var(--text,#18222d)!important;text-decoration:none!important;font-size:12px;font-weight:700;line-height:1.2;box-sizing:border-box;transition:.15s ease}.sidebar-home:hover{border-color:var(--accent,#1769d2);color:var(--accent-text,#1558a0)!important;background:var(--accent-bg,#eff6ff)}.sidebar-home:active{transform:translateY(1px)}.tdngo-standard-return{position:fixed;left:8px;bottom:12px;z-index:2147483000;width:136px}.tdngo-standard-return .sidebar-footer{padding-top:0;border-top:0;margin-top:0}</style></head>');
    {
      const s0=html.indexOf('<style id="tdngo-standard-nav-style">');
      if(s0>=0){const s1=html.indexOf('</style>',s0);if(s1>=0)html=html.slice(0,s0)+html.slice(s1+8);}
      const a0=html.indexOf('<a class="tdngo-home"');
      if(a0>=0){const a1=html.indexOf('</a>',a0);if(a1>=0)html=html.slice(0,a0)+html.slice(a1+4);}
    }
    html=html.replace('</body>','<div class="tdngo-standard-return"><div class="sidebar-footer"><a href="indicadores.html" target="_top" class="sidebar-home">Central TDNGo</a></div></div></body>');
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById('loading').textContent='Falha ao carregar Classificação de Risco: '+e.message;console.error(e)}
})();
</script>
</body></html>
