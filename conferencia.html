<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conferência Documental — TDNGo</title>
<style>
html,body{margin:0;min-height:100%;background:#f4f7fa;color:#18222d;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
#loading{min-height:100vh;display:grid;place-items:center;color:#667585}
</style>
</head>
<body>
<div id="loading">Carregando Conferência Documental...</div>
<script>
(async()=>{
  try{
    const url='https://raw.githubusercontent.com/marqcruz/contratos-fhsl-adm/0e6ebb5caf15077fb79db59b708a7f3b26ed6ba9/conferencia.html';
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    let src=await r.text();

    // O loader legado contém fechamentos de <script> escapados como <\\/script>.
    // Ao serem gravados novamente via document.write, esse formato não fecha a tag
    // no parser HTML (especialmente no Safari/iOS) e parte do JavaScript aparece na tela.
    // Convertemos o fonte carregado para gerar o fechamento correto apenas em runtime,
    // sem inserir um fechamento literal desta tag dentro deste próprio script.
    const safeCloseExpr="${'</scr'+'ipt>'}";
    src=src.split('<\\\\/script>').join(safeCloseExpr);

    const closeScript='</scr'+'ipt>';
    const extras='<script data-tdngo-light src="tdngo-light-theme-v1.js?v=20260917-1215">'+closeScript+
      '<script data-tdngo-central-nav src="tdngo-central-nav.js?v=20260917-1215">'+closeScript;
    src=src.replace('</body>',extras+'</body>');

    document.open();
    document.write(src);
    document.close();
  }catch(e){
    const el=document.getElementById('loading');
    if(el) el.textContent='Falha ao carregar Conferência: '+(e&&e.message?e.message:e);
    console.error(e);
  }
})();
</script>
</body>
</html>
