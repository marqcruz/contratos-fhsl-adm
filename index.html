<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TDNGo — Gestão Operacional Integrada</title><style>html,body{margin:0;min-height:100%;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}#initial{min-height:100vh;display:grid;place-items:center;color:#9aa7b8}</style></head><body><div id="initial">Carregando TDNGo...</div><script>
(async()=>{try{
 const base='https://raw.githubusercontent.com/marqcruz/contratos-fhsl-adm/a3a45ed9045cb27c196e05409660ff6fcca326e1/index.html';
 const r=await fetch(base,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let html=await r.text();
 html=html.replace('.login-btn:hover{background:#2b8ae6}',`.login-btn:hover{background:#2b8ae6}\n.login-btn:disabled{opacity:.72;cursor:wait}.login-btn.busy{position:relative}.login-btn.busy::before{content:'';display:inline-block;width:13px;height:13px;margin-right:8px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;vertical-align:-2px;animation:loginSpin .7s linear infinite}.login-status{font-size:11px;text-align:center;color:var(--text2);min-height:17px;margin-top:9px}.login-status.ok{color:var(--green)}@keyframes loginSpin{to{transform:rotate(360deg)}}.tdngo-loading{position:fixed;inset:0;z-index:12000;background:radial-gradient(circle at 30% 20%,#16314f 0%,#0d1117 60%);display:flex;align-items:center;justify-content:center}.tdngo-loading-box{text-align:center;color:#e6edf3}.tdngo-spinner{width:36px;height:36px;margin:0 auto 14px;border:3px solid rgba(255,255,255,.2);border-top-color:#79c0ff;border-radius:50%;animation:loginSpin .75s linear infinite}.tdngo-loading-box b{display:block;font-size:15px}.tdngo-loading-box span{display:block;margin-top:5px;font-size:11px;color:#9aa7b8}`);
 html=html.replace('<button class="login-btn" onclick="doLogin()">Entrar</button>','<button class="login-btn" id="login-btn" onclick="doLogin()">Entrar</button><div class="login-status" id="login-status"></div>');
 const old=`async function tdngoAuthLogin(email, senha){\n  const r=await fetch(TDNGO_AUTH_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',email,senha})});\n  const t=await r.text();try{return JSON.parse(t)}catch(e){return{ok:false,message:t||'Falha na autenticação central.'}}\n}\n\nasync function doLogin(){\n  const email=document.getElementById('login-email').value.trim().toLowerCase();\n  const senha=document.getElementById('login-pass').value;\n  const err=document.getElementById('login-err');err.style.display='none';\n  if(!email||!senha){err.textContent='Preencha e-mail e senha.';err.style.display='block';return;}\n  try{\n    const r=await tdngoAuthLogin(email,senha);\n    if(!r.ok){err.textContent=r.message||'E-mail ou senha incorretos.';err.style.display='block';return;}\n    currentUser=r.user||{};\n    if(r.token&&!currentUser.tdngoToken)currentUser.tdngoToken=r.token;\n  }catch(e){err.textContent='Sem conexão com o servidor de autenticação.';err.style.display='block';return;}\n  sessionStorage.setItem('fhsl_session',JSON.stringify(currentUser));\n  startApp();\n}`;
 const neu=`let loginEmAndamento=false;\nasync function tdngoAuthLogin(email,senha){const c=new AbortController(),tm=setTimeout(()=>c.abort(),15000);try{const r=await fetch(TDNGO_AUTH_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',email,senha}),signal:c.signal});const t=await r.text();try{return JSON.parse(t)}catch(e){return{ok:false,message:t||'Falha na autenticação central.'}}}finally{clearTimeout(tm)}}\nfunction loginVisual(estado,texto){const b=document.getElementById('login-btn'),s=document.getElementById('login-status');if(b){b.disabled=estado==='busy';b.classList.toggle('busy',estado==='busy');b.textContent=estado==='busy'?'Entrando...':'Entrar'}if(s){s.textContent=texto||'';s.className='login-status'+(estado==='ok'?' ok':'')}}\nfunction telaCarregando(show){let e=document.getElementById('tdngo-loading');if(show){if(!e){e=document.createElement('div');e.id='tdngo-loading';e.className='tdngo-loading';e.innerHTML='<div class="tdngo-loading-box"><div class="tdngo-spinner"></div><b>Carregando módulos...</b><span>Preparando seu ambiente de trabalho</span></div>';document.body.appendChild(e)}}else if(e)e.remove()}\nasync function doLogin(){if(loginEmAndamento)return;const email=document.getElementById('login-email').value.trim().toLowerCase(),senha=document.getElementById('login-pass').value,err=document.getElementById('login-err');err.style.display='none';if(!email||!senha){err.textContent='Preencha e-mail e senha.';err.style.display='block';return}loginEmAndamento=true;loginVisual('busy','Validando seu acesso...');try{const r=await tdngoAuthLogin(email,senha);if(!r.ok){err.textContent=r.message||'E-mail ou senha incorretos.';err.style.display='block';loginVisual('idle','');return}currentUser=r.user||{};if(r.token&&!currentUser.tdngoToken)currentUser.tdngoToken=r.token;sessionStorage.setItem('fhsl_session',JSON.stringify(currentUser));localStorage.setItem('fhsl_session',JSON.stringify(currentUser));loginVisual('ok','Login realizado.');telaCarregando(true);requestAnimationFrame(()=>setTimeout(()=>{startApp();setTimeout(()=>telaCarregando(false),120)},100))}catch(e){err.textContent=e&&e.name==='AbortError'?'O login demorou mais de 15 segundos. Tente novamente.':'Sem conexão com o servidor de autenticação.';err.style.display='block';loginVisual('idle','')}finally{loginEmAndamento=false}}`;
 if(!html.includes(old))throw new Error('Bloco de login não localizado.');html=html.replace(old,neu);
 html=html.replace(/sessionStorage\.getItem\('fhsl_session'\)/g,"(sessionStorage.getItem('fhsl_session')||localStorage.getItem('fhsl_session'))");
 html=html.replace(/sessionStorage\.setItem\('fhsl_session',JSON\.stringify\(currentUser\)\);/g,"sessionStorage.setItem('fhsl_session',JSON.stringify(currentUser));localStorage.setItem('fhsl_session',JSON.stringify(currentUser));");
 html=html.replace(/sessionStorage\.removeItem\('fhsl_session'\);/g,"sessionStorage.removeItem('fhsl_session');localStorage.removeItem('fhsl_session');");
 const compraCard='<a class="hub-card" data-mod="planejamento_compras" data-cat="gestao" data-search="compras estoque sishosp planejamento previsão consumo cobertura fornecedor materiais" href="planejamento-compras.html"><span class="hub-ico">📦</span><h3>Planejamento de Compras</h3><p>Dimensionamento por consumo, cobertura e prazo de reposição.</p><span class="hub-tag ativo">Disponível</span></a>\n        ';
 const docCard='<a class="hub-card" data-mod="documentos" data-cat="operacao" data-search="documentos internos solicitação interna termo orientação ponto formulário pdf" href="documentos-internos.html"><span class="hub-ico">📄</span><h3>Documentos Internos</h3><p>Solicitação interna e termos institucionais.</p><span class="hub-tag ativo">Disponível</span></a>\n        ';
 html=html.replace('<a class="hub-card" data-mod="admin"',compraCard+docCard+'<a class="hub-card" data-mod="admin"');
 document.open();document.write(html);document.close();
}catch(e){document.getElementById('initial').textContent='Falha ao carregar TDNGo: '+e.message;console.error(e)}})();
</script></body></html>
