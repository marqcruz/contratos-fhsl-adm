<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chaves — TDNGo</title><style>html,body{margin:0;min-height:100%;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}#loading{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center}</style></head>
<body><div id="loading">Carregando controle de chaves...</div>
<script>
(async()=>{
 try{
  const base='https://raw.githubusercontent.com/marqcruz/contratos-fhsl-adm/5c2f6e804cd88bd7671cd04b03b6e962bcd45021/chaves.html';
  const r=await fetch(base,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
  let html=await r.text();
  html=html.replace("let user=null,chaves=[],locais=[],movs=[],tipos=[],page='painel';","let user=null,chaves=[],locais=[],movs=[],tipos=[],page='painel',unidadesAcesso=[],unidadeAtual=''; const TIPOS_PADRAO=['Porta','Sala','Portão','Armário','Cadeado','Veículo','Carro','Outros'];");
  html=html.replace('<button class="btn primary" id="topAction" onclick="topAction()">+ Nova chave</button>','<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><select id="unidadeSel" onchange="trocarUnidade()" style="background:#161b22;border:1px solid #2a3140;color:#e6edf3;border-radius:8px;padding:8px 10px;min-width:210px"></select><button class="btn primary" id="topAction" onclick="topAction()">+ Nova chave</button></div>');
  html=html.replace('<input id="ctipo" list="tipos" placeholder="Ex: Sala, Veículo"><datalist id="tipos"></datalist>','<select id="ctipo"><option value="">Selecione...</option></select>');
  html=html.replace('<th>Usuário</th></tr></thead><tbody id="tb-hist">','<th>Usuário</th><th></th></tr></thead><tbody id="tb-hist">');
  const oldLoad="async function load(){const r=await call(API,{action:'bootstrap'});if(!r.ok){alert(r.message||'Falha ao carregar Chaves.');return}chaves=r.chaves||[];locais=(r.locais||[]).filter(x=>x.Ativo!==false);movs=r.movs||[];tipos=r.tipos||[];fill();renderAll()}";
  const newLoad="async function load(){const r=await call(API,{action:'bootstrap',unidadeId:unidadeAtual||undefined});if(!r.ok){alert(r.message||'Falha ao carregar Chaves.');return}unidadesAcesso=r.unidades||[];unidadeAtual=r.unidadeAtual?.id||unidadeAtual||'';const us=$('unidadeSel');if(us){us.innerHTML=unidadesAcesso.map(u=>`<option value=\"${esc(u.id)}\">${esc(u.nome)}</option>`).join('');us.value=unidadeAtual;us.disabled=unidadesAcesso.length<=1;}chaves=r.chaves||[];locais=(r.locais||[]).filter(x=>x.Ativo!==false);movs=r.movs||[];tipos=[...new Set([...TIPOS_PADRAO,...(r.tipos||[])])];fill();renderAll()} async function trocarUnidade(){unidadeAtual=$('unidadeSel').value;await load()}";
  if(!html.includes(oldLoad))throw new Error('Rotina de carga não localizada.');html=html.replace(oldLoad,newLoad);
  html=html.replace("function fill(){$('clocal').innerHTML='<option value=\"\">Selecione...</option>'+locais.map(l=>`<option>${esc(l.Nome)}</option>`).join('');$('tipos').innerHTML=tipos.map(t=>`<option value=\"${esc(t)}\">`).join('')}","function fill(){$('clocal').innerHTML='<option value=\"\">Selecione...</option>'+locais.map(l=>`<option>${esc(l.Nome)}</option>`).join('');const tp=$('ctipo');if(tp){const atual=tp.value;tp.innerHTML='<option value=\"\">Selecione...</option>'+tipos.map(t=>`<option value=\"${esc(t)}\">${esc(t)}</option>`).join('');if(tipos.includes(atual))tp.value=atual;}} ");
  html=html.replace("function canEdit(){return ['admin','gestor'].includes(user?.role)} function canAdmin(){return user?.role==='admin'}","function canEdit(){return ['admin','gestor','cadastros'].includes(user?.role)} function canAdmin(){return user?.role==='admin'}");
  const oldHist="function renderHistorico(){const q=$('qhist').value.toLowerCase();const list=movs.filter(m=>!q||JSON.stringify(m).toLowerCase().includes(q));$('e-hist').style.display=list.length?'none':'block';$('tb-hist').innerHTML=list.map(m=>`<tr><td>${fmt(m.DataHora)}</td><td>${m.Acao==='Retirada'?'📤':'↩'} ${esc(m.Acao)}</td><td><b>${esc(m.Codigo)}</b></td><td>${esc(m.ChaveNome)}</td><td>${esc(m.Pessoa||'—')}</td><td>${esc(m.Setor||'—')}</td><td>${esc(m.Usuario||'—')}</td></tr>`).join('')}";
  const newHist="function renderHistorico(){const q=$('qhist').value.toLowerCase();const list=movs.filter(m=>!q||JSON.stringify(m).toLowerCase().includes(q));$('e-hist').style.display=list.length?'none':'block';$('tb-hist').innerHTML=list.map(m=>`<tr><td>${fmt(m.DataHora)}</td><td>${m.Acao==='Retirada'?'📤':'↩'} ${esc(m.Acao)}</td><td><b>${esc(m.Codigo)}</b></td><td>${esc(m.ChaveNome)}</td><td>${esc(m.Pessoa||'—')}</td><td>${esc(m.Setor||'—')}</td><td>${esc(m.Usuario||'—')}</td><td>${canAdmin()?`<button class=\"btn danger\" onclick=\"delMov('${m.ID}')\">Excluir</button>`:''}</td></tr>`).join('')}";
  if(!html.includes(oldHist))throw new Error('Histórico não localizado.');html=html.replace(oldHist,newHist);
  const oldOpenMov="function openMov(id,acao){const c=chaves.find(x=>String(x.ID)===String(id));$('mid').value=id;$('macao').value=acao;$('mmt').textContent=acao==='Retirada'?'Retirar chave':'Devolver chave';$('minfo').innerHTML=`<b>${esc(c.Codigo)}</b> — ${esc(c.Nome)} · ${esc(c.Local)}`;$('pessoaWrap').style.display=acao==='Retirada'?'flex':'none';$('mpessoa').value='';$('msetor').value='';$('mobs').value='';openM('m-mov')}";
  const newOpenMov="function openMov(id,acao){const c=chaves.find(x=>String(x.ID)===String(id));$('mid').value=id;$('macao').value=acao;$('mmt').textContent=acao==='Retirada'?'Retirar chave':'Devolver chave';$('minfo').innerHTML=`<b>${esc(c.Codigo)}</b> — ${esc(c.Nome)} · ${esc(c.Local)}`;$('pessoaWrap').style.display='flex';$('pessoaWrap').querySelector('label').textContent=acao==='Retirada'?'Quem está retirando *':'Quem está devolvendo *';$('mpessoa').value='';$('msetor').value='';$('mobs').value='';openM('m-mov')}";
  if(!html.includes(oldOpenMov))throw new Error('Modal de movimentação não localizado.');html=html.replace(oldOpenMov,newOpenMov);
  html=html.replace("call(API,{action:'saveChave',payload})","call(API,{action:'saveChave',unidadeId:unidadeAtual,payload})");
  html=html.replace("call(API,{action:'deleteChave',id})","call(API,{action:'deleteChave',unidadeId:unidadeAtual,id})");
  html=html.replace("call(API,{action:'saveMov',payload})","call(API,{action:'saveMov',unidadeId:unidadeAtual,payload})");
  html=html.replace("async function saveMov(){const payload={ChaveID:$('mid').value,Acao:$('macao').value,Pessoa:$('mpessoa').value.trim(),Setor:$('msetor').value.trim(),Obs:$('mobs').value.trim()};const r=await call(API,{action:'saveMov',unidadeId:unidadeAtual,payload});if(!r.ok)return alert(r.message);closeM('m-mov');await load()}","async function saveMov(){const acao=$('macao').value,pessoa=$('mpessoa').value.trim();if(!pessoa)return alert(acao==='Devolução'?'Informe quem está devolvendo.':'Informe quem está retirando.');const payload={ChaveID:$('mid').value,Acao:acao,Pessoa:pessoa,Setor:$('msetor').value.trim(),Obs:$('mobs').value.trim()};const r=await call(API,{action:'saveMov',unidadeId:unidadeAtual,payload});if(!r.ok)return alert(r.message);closeM('m-mov');await load()} async function delMov(id){if(!canAdmin())return;if(!confirm('Excluir este registro do histórico?'))return;const r=await call(API,{action:'deleteMov',unidadeId:unidadeAtual,id});if(!r.ok)return alert(r.message);await load()}");
  html=html.replace("call(API,{action:'saveLocal',payload:{ID:$('lid').value,Nome:$('lnome').value.trim()}})","call(API,{action:'saveLocal',unidadeId:unidadeAtual,payload:{ID:$('lid').value,Nome:$('lnome').value.trim()}})");
  html=html.replace("call(API,{action:'deleteLocal',id})","call(API,{action:'deleteLocal',unidadeId:unidadeAtual,id})");
  if(html.includes('script.google.com')||html.includes('LEGACY_URL'))throw new Error('Referência legada encontrada no módulo Chaves.');
  if(html.includes('list="tipos"')||html.includes("['admin','gestor'].includes(user?.role)"))throw new Error('Conversão do formulário/perfil não aplicada.');
  document.open();document.write(html);document.close();
 }catch(e){document.getElementById('loading').textContent='Falha ao carregar Chaves: '+e.message;console.error(e)}
})();
</script><script src="tdngo-nav.js"></script>
</body></html>
