name: TDNGo hotfix
on:
  push:
    branches: [layout_gpt]
    paths: ['.github/workflows/tdngo-hotfix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: layout_gpt
      - name: Aplicar ajustes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # CONTRATOS
          p=Path('contratos.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\s*<div style="margin-top:auto;padding-top:1rem;border-top:1px solid var\(--border\)">\s*<div class="conf-status" id="conn-status"[^>]*>[\s\S]*?</div>\s*</div>','',s,count=1)
          s=re.sub(r'\s*<div class="nav-group perm-admin">\s*<div class="nav-label">(?:Administração|Controle)</div>[\s\S]*?<button class="nav-item" data-page="auditoria"[\s\S]*?</div>','',s,count=1)
          s=re.sub(r'\s*<!-- AUDITORIA -->\s*<div class="page" id="page-auditoria">[\s\S]*?(?=\s*<!-- SETUP -->)','',s,count=1)
          s=s.replace("  auditoria:['Auditoria','Registro de todas as ações no sistema'],\n",'')
          s=re.sub(r'async function checkConnection\(\) \{[\s\S]*?\n\}',"async function checkConnection() {\n  try { const r = await contratosApi('ping',{}); return !!(r && r.ok); } catch(e) { return false; }\n}",s,count=1)
          # Remove botão indevidamente colocado dentro do HTML de impressão
          emb='<a class="tdngo-home" href="index.html" title="Voltar ao painel principal do TDNGo" aria-label="Voltar ao TDNGo"><span class="tdngo-home-ico">⌂</span><span class="tdngo-home-copy"><b>TDNGo</b><small>Voltar aos módulos</small></span></a>'
          s=s.replace(emb,'')
          # Insere botão real antes do último </body>
          button='''\n<a class="tdngo-home" href="index.html" title="Voltar ao painel principal do TDNGo" aria-label="Voltar ao TDNGo">\n  <span class="tdngo-home-ico">⌂</span>\n  <span class="tdngo-home-copy"><b>TDNGo</b><small>Voltar aos módulos</small></span>\n</a>\n'''
          pos=s.lower().rfind('</body>')
          if pos>=0 and 'Voltar aos módulos</small></span>\n</a>\n</body>' not in s[max(0,pos-600):pos+20]: s=s[:pos]+button+s[pos:]
          if 'function renderAuditoria(){' in s and "if(!document.getElementById('audit-body')) return;" not in s:
            s=s.replace('function renderAuditoria(){',"function renderAuditoria(){\n  if(!document.getElementById('audit-body')) return;",1)
          p.write_text(s,encoding='utf-8')

          # SEGURANÇA
          p=Path('seguranca.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>Segurança Institucional — TDNGo</title>','<title>Segurança Institucional — TDNGo v2</title>',1)
          needle='.fg textarea{min-height:72px;resize:vertical}.note'
          if needle in s:
            s=s.replace(needle,'.fg textarea{min-height:72px;resize:vertical}.attach-box{border:1px dashed var(--bd);border-radius:9px;padding:10px;background:var(--card2)}.attach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:8px}.attach-item{position:relative;border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:var(--card)}.attach-item img{width:100%;height:86px;object-fit:cover;display:block}.attach-item .aname{font-size:9px;padding:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.attach-item button{position:absolute;right:4px;top:4px;border:0;border-radius:999px;width:23px;height:23px;background:rgba(20,20,20,.8);color:#fff;cursor:pointer}.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.report-field{border:1px solid var(--bd);border-radius:8px;padding:9px}.report-field b{display:block;font-size:9px;color:var(--mut);text-transform:uppercase;margin-bottom:3px}.report-section{margin-top:10px;border:1px solid var(--bd);border-radius:8px;padding:10px}.report-section b{display:block;font-size:10px;color:var(--mut);text-transform:uppercase;margin-bottom:5px}.report-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.report-photos img{width:100%;height:140px;object-fit:cover;border:1px solid var(--bd);border-radius:7px}.note',1)
          needle='<div class="fg full"><label>Conclusão / plano de ação</label><textarea id="f-conclusao"></textarea></div>'
          if needle in s and 'id="f-imagens"' not in s:
            s=s.replace(needle,needle+'<div class="fg full"><label>Imagens / evidências</label><div class="attach-box"><input id="f-imagens" type="file" accept="image/jpeg,image/png,image/webp" multiple><div style="font-size:9px;color:var(--mut);margin-top:4px">JPG, PNG ou WEBP · até 6 imagens por ocorrência · máximo 5 MB por imagem.</div><div class="attach-grid" id="attach-grid"></div></div></div>',1)
          marker='</div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button class="btn" onclick="closeForm()">Cancelar</button><button class="btn primary" onclick="saveOcorrencia()">Salvar ocorrência</button></div></div></div>'
          if marker in s and 'id="report-modal"' not in s:
            s=s.replace(marker,marker+'\n<div class="modal" id="report-modal"><div class="mc"><div class="mh"><div class="mt">Relatório da ocorrência</div><div style="display:flex;gap:7px"><button class="btn" onclick="printReportCurrent()">🖨 Imprimir relatório</button><button class="btn" onclick="closeReport()">✕</button></div></div><div id="report-body"></div></div></div>',1)
          s=s.replace("let ocorrencias=[],unidades=[],pesos={BAIXA:1,'MÉDIA':2,ALTA:4,'CRÍTICA':6},currentUser=null;","let ocorrencias=[],unidades=[],pesos={BAIXA:1,'MÉDIA':2,ALTA:4,'CRÍTICA':6},currentUser=null,pendingImages=[],existingAttachments=[],currentReport=null;",1)
          old='<td>${podeEditar()?`<button class="btn" onclick="openForm(\'${o.ID}\')">Editar</button>`:\'\'} ${podeExcluir()?`<button class="btn danger" onclick="delO(\'${o.ID}\')">Excluir</button>`:\'\'}</td>'
          new='<td><button class="btn" onclick="openReport(\'${o.ID}\')">Relatório</button> ${podeEditar()?`<button class="btn" onclick="openForm(\'${o.ID}\')">Editar</button>`:\'\'} ${podeExcluir()?`<button class="btn danger" onclick="delO(\'${o.ID}\')">Excluir</button>`:\'\'}</td>'
          s=s.replace(old,new,1)
          s=re.sub(r"function openForm\(id\)\{.*?\}\nfunction closeForm",'''function openForm(id){if(!podeEditar())return;const o=id?ocorrencias.find(x=>x.ID===id):null;$('form-title').textContent=o?'Editar ocorrência':'Nova ocorrência';$('f-id').value=o?.ID||'';$('f-data').value=o?inputSP(o.Data):nowInput();$('form-unidade').value=o?.UnidadeId||'';$('form-tipo').value=o?.Tipo||'';$('form-gravidade').value=o?.Gravidade||'BAIXA';$('f-local').value=o?.Local||'';$('form-status').value=o?.Status||'ABERTA';$('f-envolvidos').value=o?.Envolvidos||'';$('f-dano').value=o?.Dano||'NÃO';$('f-valor').value=o?.Valor||'';$('f-externo').value=o?.Externo||'NÃO';$('f-responsavel').value=o?.Responsavel||'';$('f-prazo').value=o?.Prazo||'';$('f-descricao').value=o?.Descricao||'';$('f-providencias').value=o?.Providencias||'';$('f-conclusao').value=o?.Conclusao||'';pendingImages=[];existingAttachments=[];$('f-imagens').value='';renderAttachments();$('modal').classList.add('open');if(o)loadAttachments(o.ID)}\nfunction closeForm''',s,count=1,flags=re.S)
          s=re.sub(r"async function saveOcorrencia\(\)\{.*?\}\nasync function delO",'''async function fileToBase64(file){return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]||'');r.onerror=reject;r.readAsDataURL(file)})}\nasync function uploadPending(ocorrenciaId){for(const f of pendingImages){const base64=await fileToBase64(f);await api('uploadAttachment',{ocorrenciaId,nome:f.name,mimeType:f.type||'image/jpeg',base64})}}\nasync function saveOcorrencia(){const payload={ID:$('f-id').value||'',Data:$('f-data').value,UnidadeId:$('form-unidade').value,Tipo:$('form-tipo').value,Gravidade:$('form-gravidade').value,Local:$('f-local').value,Status:$('form-status').value,Envolvidos:$('f-envolvidos').value,Dano:$('f-dano').value,Valor:$('f-valor').value,Externo:$('f-externo').value,Responsavel:$('f-responsavel').value,Prazo:$('f-prazo').value,Descricao:$('f-descricao').value,Providencias:$('f-providencias').value,Conclusao:$('f-conclusao').value};if(!payload.Data||!payload.UnidadeId||!payload.Tipo||!payload.Local.trim()||!payload.Descricao.trim()){toast('Preencha os campos obrigatórios.','err');return}if(existingAttachments.length+pendingImages.length>6){toast('Limite de 6 imagens por ocorrência.','err');return}try{$('loading').style.display='flex';const r=await api('save',{payload});if(pendingImages.length)await uploadPending(r.id);closeForm();toast(`Ocorrência ${r.numero} salva${pendingImages.length?' com imagens':''}.`);await reload()}catch(e){toast(e.message,'err')}finally{$('loading').style.display='none'}}\nasync function delO''',s,count=1,flags=re.S)
          if 'function renderAttachments()' not in s:
            funcs=r'''function renderAttachments(){const g=$('attach-grid');const a=[...existingAttachments.map(x=>({kind:'saved',...x})),...pendingImages.map((f,i)=>({kind:'pending',_i:i,Nome:f.name,Url:URL.createObjectURL(f)}))];g.innerHTML=a.map(x=>`<div class="attach-item"><img src="${x.Url}" alt=""><div class="aname">${esc(x.Nome||'imagem')}</div>${podeEditar()?`<button type="button" onclick="removeAttachmentUI('${x.kind}',${x.kind==='saved'?`'${x.ID}'`:x._i})">×</button>`:''}</div>`).join('')||'<div style="font-size:10px;color:var(--mut)">Nenhuma imagem anexada.</div>'}
async function loadAttachments(id){try{const r=await api('listAttachments',{ocorrenciaId:id});existingAttachments=r.data||[];renderAttachments()}catch(e){toast(e.message,'err')}}
async function removeAttachmentUI(kind,id){if(kind==='pending'){pendingImages.splice(Number(id),1);renderAttachments();return}if(!confirm('Remover esta imagem da ocorrência?'))return;try{await api('deleteAttachment',{id});existingAttachments=existingAttachments.filter(x=>x.ID!==id);renderAttachments();toast('Imagem removida.')}catch(e){toast(e.message,'err')}}
function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
async function openReport(id){const o=ocorrencias.find(x=>x.ID===id);if(!o)return;try{$('loading').style.display='flex';const r=await api('listAttachments',{ocorrenciaId:id});currentReport={o,anexos:r.data||[]};renderReport();$('report-modal').classList.add('open')}catch(e){toast(e.message,'err')}finally{$('loading').style.display='none'}}
function closeReport(){$('report-modal').classList.remove('open');currentReport=null}
function renderReport(){if(!currentReport)return;const {o,anexos}=currentReport;$('report-body').innerHTML=`<div style="text-align:center;margin-bottom:12px"><div style="font-size:18px;font-weight:800">RELATÓRIO DE OCORRÊNCIA DE SEGURANÇA</div><div style="font-size:12px;color:var(--mut);margin-top:3px">${esc(o.Numero)} · ${esc(o.Unidade)}</div></div><div class="report-grid">${[['Data/Hora',fmtDT(o.Data)],['Tipo',o.Tipo],['Gravidade',o.Gravidade],['Local/Setor',o.Local],['Status',o.Status],['Envolvidos',o.Envolvidos||'—'],['Dano ao patrimônio',o.Dano],['Valor estimado',money(o.Valor)],['Acionamento externo',o.Externo],['Responsável',o.Responsavel||'—'],['Prazo',o.Prazo||'—']].map(([k,v])=>`<div class="report-field"><b>${k}</b>${esc(v)}</div>`).join('')}</div><div class="report-section"><b>Descrição objetiva</b>${esc(o.Descricao||'—')}</div><div class="report-section"><b>Providências adotadas</b>${esc(o.Providencias||'—')}</div><div class="report-section"><b>Conclusão / plano de ação</b>${esc(o.Conclusao||'—')}</div><div class="report-section"><b>Evidências fotográficas (${anexos.length})</b><div class="report-photos">${anexos.map(a=>`<img src="${a.Url}" alt="${esc(a.Nome)}">`).join('')||'<span style="color:var(--mut);font-size:11px">Sem imagens anexadas.</span>'}</div></div>`}
function printReportCurrent(){if(!currentReport)return;const {o,anexos}=currentReport;const photos=anexos.map(a=>`<figure><img src="${a.Url}"><figcaption>${esc(a.Nome)}</figcaption></figure>`).join('');const rows=[['Número',o.Numero],['Unidade',o.Unidade],['Data/Hora',fmtDT(o.Data)],['Tipo',o.Tipo],['Gravidade',o.Gravidade],['Local/Setor',o.Local],['Status',o.Status],['Envolvidos',o.Envolvidos||'—'],['Dano ao patrimônio',o.Dano],['Valor estimado',money(o.Valor)],['Acionamento externo',o.Externo],['Responsável',o.Responsavel||'—'],['Prazo',o.Prazo||'—']].map(([k,v])=>`<div class="f"><b>${k}</b><span>${esc(v)}</span></div>`).join('');const html=`<!doctype html><html><head><meta charset="utf-8"><title>${esc(o.Numero)}</title><style>@page{size:A4;margin:14mm}body{font-family:Arial,sans-serif;color:#111;font-size:11px}h1{text-align:center;font-size:17px;margin:0 0 4px}.sub{text-align:center;color:#555;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.f{border:1px solid #bbb;padding:7px}.f b{display:block;font-size:8px;text-transform:uppercase;color:#555;margin-bottom:2px}.sec{margin-top:10px;border:1px solid #bbb;padding:8px}.sec b{display:block;font-size:9px;text-transform:uppercase;margin-bottom:5px}.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:7px}.photos figure{margin:0;break-inside:avoid}.photos img{width:100%;max-height:240px;object-fit:contain;border:1px solid #ccc}.photos figcaption{font-size:8px;color:#555;margin-top:2px}.foot{margin-top:16px;border-top:1px solid #bbb;padding-top:6px;font-size:8px;color:#666}</style></head><body><h1>RELATÓRIO DE OCORRÊNCIA DE SEGURANÇA</h1><div class="sub">Fundação Hospital Santa Lydia · TDNGo</div><div class="grid">${rows}</div><div class="sec"><b>Descrição objetiva</b>${esc(o.Descricao||'—')}</div><div class="sec"><b>Providências adotadas</b>${esc(o.Providencias||'—')}</div><div class="sec"><b>Conclusão / plano de ação</b>${esc(o.Conclusao||'—')}</div><div class="sec"><b>Evidências fotográficas (${anexos.length})</b><div class="photos">${photos||'Sem imagens anexadas.'}</div></div><div class="foot">Emitido em ${new Date().toLocaleString('pt-BR')} · TDNGo — Segurança Institucional</div><script>window.onload=()=>setTimeout(()=>window.print(),500)<\/script></body></html>`;const w=window.open('','_blank');w.document.write(html);w.document.close()}
$('f-imagens').addEventListener('change',e=>{const files=[...e.target.files].filter(f=>['image/jpeg','image/png','image/webp'].includes(f.type)&&f.size<=5*1024*1024);const room=Math.max(0,6-existingAttachments.length-pendingImages.length);pendingImages.push(...files.slice(0,room));if(files.length>room)toast('Algumas imagens não foram adicionadas por causa do limite de 6.','err');renderAttachments();e.target.value=''})
'''
            s=s.replace('function exportCSV(){',funcs+'function exportCSV(){',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar arquivos
        run: |
          grep -q 'class="tdngo-home"' contratos.html
          grep -q 'id="f-imagens"' seguranca.html
          grep -q 'Relatório' seguranca.html
      - name: Commit do hotfix
        run: |
          git config user.name "TDNGo Automation"
          git config user.email "actions@users.noreply.github.com"
          git add contratos.html seguranca.html
          git commit -m "TDNGo: corrige navegação e adiciona fotos no relatório de segurança" || exit 0
          git push origin layout_gpt
