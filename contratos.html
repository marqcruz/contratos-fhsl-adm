;};
  renderPendencias=function(){var ativos=contracts.filter(function(c){return['Encerrado','Suspenso'].indexOf(c.statusContrato)<0;}),semFiscal=ativos.filter(function(c){return!c.fiscalNome;}),semValor=ativos.filter(function(c){return!c.valorTotal;}),semGestor=ativos.filter(function(c){return!c.gestorNome;}),hoje=new Date();hoje.setHours(0,0,0,0);var renovar=ativos.filter(function(c){if(c.renovacaoIniciada==='Sim'||!c.vigenciaFim)return false;var p=c.vigenciaFim.split('/');if(p.length<3)return false;var dias=Math.round((new Date(+p[2],+p[1]-1,+p[0])-hoje)/86400000);return dias>0&&dias<=90;}),card=function(titulo,lista,icon){var itens=lista.length?lista.slice(0,50).map(function(c){return '<div class="alert-card" onclick="showDetail(\''+c.id+'\')"><div class="alert-title">'+(c.numero||'—')+' — '+(c.empresa||'—')+'</div></div>';}).join(''):'<div style="color:var(--green);font-size:13px">✓ Nenhuma pendência</div>';return '<div class="chart-card"><div class="chart-title">'+icon+' '+titulo+' <span class="badge negociacao">'+lista.length+'</span></div>'+itens+'</div>';};document.getElementById('pendencias-body').innerHTML='<div class="chart-row">'+card('Sem fiscal designado',semFiscal,'👤')+card('Sem valor preenchido',semValor,'💰')+'</div><div class="chart-row" style="margin-top:1rem">'+card('Sem gestor designado',semGestor,'🧑‍💼')+card('Vencendo sem renovação iniciada',renovar,'🔄')+'</div>';};
